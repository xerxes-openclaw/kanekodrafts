<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanekodrafts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #06080c;
  --steel: #131820;
  --steel2: #1a2029;
  --steel3: #232b37;
  --line: #2d3644;
  --edge: #46536655;
  --text: #dde4ee;
  --dim: #7d8798;
  --gold: #f5b942;
  --gold2: #ffd77e;
  --blue: #2f8bff;
  --blueDeep: #0d2a55;
  --blueGlow: rgba(47, 139, 255, 0.35);
  --red: #ff3f3f;
  --redDeep: #4a0f14;
  --redGlow: rgba(255, 63, 63, 0.32);
  --green: #35d07f;
  --amber: #f5b942;
  --carbon:
    repeating-linear-gradient(45deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,0.014) 0 2px, transparent 2px 5px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background:
    radial-gradient(1200px 500px at 15% -5%, rgba(47,139,255,0.10), transparent 60%),
    radial-gradient(1200px 500px at 85% -5%, rgba(255,63,63,0.10), transparent 60%),
    var(--carbon),
    linear-gradient(180deg, #0a0e14, var(--bg) 340px);
  background-color: var(--bg);
  color: var(--text);
  font: 14px/1.45 "Bahnschrift", "Segoe UI", "Arial Narrow", Arial, sans-serif;
  padding: 14px 16px 20px;
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* ============ TOP HUD ============ */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
h1 {
  font-size: 21px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
  color: #f2f6fc;
  background: linear-gradient(100deg, var(--steel3), var(--steel) 70%);
  border: 1px solid var(--line); border-left: 3px solid var(--gold);
  clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 100%, 0 100%);
  padding: 8px 30px 8px 14px;
  text-shadow: 0 0 18px rgba(245,185,66,0.25);
}
h1 span { color: var(--gold2); }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
select, button, input {
  background: linear-gradient(180deg, var(--steel3), var(--steel2));
  color: var(--text); border: 1px solid var(--line);
  border-radius: 0;
  clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  padding: 8px 16px; font: inherit; font-size: 13px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
button { cursor: pointer; font-weight: 700; }
button:hover { border-color: var(--gold); color: var(--gold2); }
select:focus, input:focus { outline: 1px solid var(--gold); outline-offset: -1px; }

/* ============ CENTER PHASE BAR (draft timer) ============ */
.phasebar { display: flex; align-items: stretch; height: 58px; margin: 4px 0 16px; }
.pwing { flex: 1; position: relative; align-self: center; height: 34px; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
.pwing.wblue {
  background: linear-gradient(90deg, transparent, rgba(23,80,170,0.55) 55%, rgba(47,139,255,0.75));
  clip-path: polygon(0 50%, 24px 0, 100% 0, 100% 100%, 24px 100%);
  box-shadow: 0 0 28px var(--blueGlow);
}
.pwing.wred {
  background: linear-gradient(90deg, rgba(255,63,63,0.72), rgba(150,25,30,0.5) 45%, transparent);
  clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 50%, calc(100% - 24px) 100%, 0 100%);
  box-shadow: 0 0 28px var(--redGlow);
}
.pcenter {
  min-width: 430px; margin: 0 -14px; z-index: 1;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.06), transparent 40%),
    var(--carbon),
    linear-gradient(180deg, #2a3341, #141a23 70%);
  border-top: 2px solid var(--gold);
  clip-path: polygon(26px 0, calc(100% - 26px) 0, 100% 100%, 0 100%);
  display: flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 0 16px rgba(245,185,66,0.18));
}
.phase {
  font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.26em;
  color: var(--gold2); text-shadow: 0 0 16px rgba(245,185,66,0.55);
  white-space: nowrap; padding: 0 18px;
}

/* ============ LAYOUT ============ */
.layout { display: grid; grid-template-columns: 300px 1fr 300px; grid-auto-rows: minmax(min-content, 1fr); gap: 14px; flex: 1; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr 1fr; } .mid { grid-column: 1 / -1; order: -1; } .pcenter { min-width: 0; flex: 3; } }

/* ============ TEAM COLUMNS ============ */
.teamcol {
  padding: 0 10px 12px;
  background: var(--carbon), linear-gradient(180deg, var(--steel2), #0d1118 85%);
  position: relative;
}
.teamcol.blue {
  --teamc: var(--blue); --teamGlow: var(--blueGlow);
  background:
    linear-gradient(165deg, rgba(35,105,220,0.28), rgba(10,24,50,0.20) 40%, transparent 75%),
    var(--carbon),
    linear-gradient(180deg, #10192a, #0a0f18 85%);
  border: 1px solid rgba(70,140,255,0.4);
  clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
  box-shadow: inset 0 0 60px rgba(30,100,230,0.10);
}
.teamcol.red {
  --teamc: var(--red); --teamGlow: var(--redGlow);
  background:
    linear-gradient(195deg, rgba(230,50,55,0.26), rgba(50,10,14,0.20) 40%, transparent 75%),
    var(--carbon),
    linear-gradient(180deg, #221016, #120a0c 85%);
  border: 1px solid rgba(255,80,80,0.4);
  clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
  box-shadow: inset 0 0 60px rgba(220,40,45,0.10);
}
.teamcol h2 {
  font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.22em;
  color: #fff; margin: 0 -10px 12px; padding: 11px 14px;
  display: flex; justify-content: space-between; align-items: center;
  text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}
.blue h2 {
  background: linear-gradient(95deg, #2a74e0, #123163 60%, rgba(18,49,99,0.25));
  border-bottom: 2px solid var(--blue);
  clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
}
.red h2 {
  background: linear-gradient(265deg, #e03a40, #5a1418 60%, rgba(90,20,24,0.25));
  border-bottom: 2px solid var(--red);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 18px 100%);
}
.mine {
  font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
  background: linear-gradient(180deg, var(--gold2), var(--gold));
  color: #241a06; border: 0; padding: 4px 12px;
  clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
}
.mine.off { background: rgba(10,14,20,0.7); color: var(--dim); border: 1px solid var(--line); }
.mine.off:hover { color: var(--gold2); }

/* ---- slots ---- */
.slot {
  display: flex; align-items: center; gap: 9px;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--teamc) 14%, transparent), transparent 65%),
    linear-gradient(180deg, rgba(255,255,255,0.03), transparent 45%),
    #0d1219;
  border: 1px solid var(--line); border-left: 3px solid var(--teamc);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  padding: 5px 8px; margin-bottom: 7px; min-height: 50px; cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.red .slot {
  border-left: 1px solid var(--line); border-right: 3px solid var(--teamc);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
}
.slot:hover { border-color: var(--gold); }
.slot.ban { min-height: 54px; background: #0b0e13; border-left-color: #59333a; border-right-color: #59333a; position: relative; }
.slot.ban img { filter: grayscale(1) brightness(1.5); }
.slot.ban .pf { width: 44px; height: 44px; border-color: #59333a; }
.slot.ban .lbl { color: #c95b66; }
.slot.ban:has(img) .lbl {
  position: absolute; left: 4px; top: 3px; z-index: 2; width: auto;
  background: linear-gradient(180deg, #d92c34, #8f161d); color: #fff;
  padding: 1px 6px 2px; clip-path: polygon(0 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
  box-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.slot.ban .who { color: #97a0af; }
/* slot numbering: PICK 1..5 and BAN 1..3 per team */
#blueSlots, #redSlots { counter-reset: pickn bann; }
.slot.pick { counter-increment: pickn; }
.slot.pick .lbl::after { content: " " counter(pickn); }
.slot.ban { counter-increment: bann; }
.slot.ban .lbl::after { content: " " counter(bann); }
/* empty rows read as a 16-slot grid */
.slot:has(.who.empty):not(.active) { outline: 1px dashed rgba(255,255,255,0.18); outline-offset: -5px; }
.slot.active {
  border-color: var(--gold); border-left-color: var(--gold); border-right-color: var(--gold);
  opacity: 1;
  animation: slotpulse 1.4s ease-in-out infinite;
}
.slot.active .lbl { color: var(--gold2); text-shadow: 0 0 8px rgba(245,185,66,0.6); }
.slot.active .who.empty { color: var(--gold2); }
@keyframes slotpulse {
  0%, 100% { box-shadow: inset 0 0 10px rgba(245,185,66,0.18); background-color: #151109; }
  50% { box-shadow: inset 0 0 26px rgba(245,185,66,0.45); background-color: #1e1809; }
}
.slot .lbl { font-size: 9px; font-weight: 800; color: var(--dim); width: 38px; flex: none; text-transform: uppercase; letter-spacing: 0.1em; }
.pf {
  width: 40px; height: 40px; border-radius: 2px;
  border: 2px solid var(--line); flex: none; object-fit: cover;
  background: #0a0d12;
  box-shadow: 0 2px 6px rgba(0,0,0,0.55);
}
.slot .who { font-weight: 800; font-size: 13.5px; text-transform: uppercase; letter-spacing: 0.05em; }
.slot .who .r { display: block; font-size: 8.5px; color: var(--dim); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
.slot .who.empty { color: rgba(255,255,255,0.35); font-weight: 700; letter-spacing: 0.3em; }
.slot .x { margin-left: auto; color: var(--dim); font-size: 12px; padding: 0 4px; }
.slot .x:hover { color: var(--red); }

/* ============ CENTER PANELS ============ */
.mid { display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.sugg, .buildbox {
  background: var(--carbon), linear-gradient(180deg, var(--steel2), #0e1219 90%);
  border: 1px solid var(--line); border-top: 2px solid var(--gold);
  clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%, 0 14px);
  padding: 12px 14px 12px;
}
.sugg h2 {
  font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em;
  color: var(--gold2); margin: 0 0 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  text-shadow: 0 0 12px rgba(245,185,66,0.3);
}
.scard {
  background:
    linear-gradient(90deg, rgba(245,185,66,0.06), transparent 30%),
    linear-gradient(180deg, rgba(255,255,255,0.03), transparent 45%),
    #10151d;
  border: 1px solid var(--line); border-left: 3px solid var(--gold);
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 100%, 0 100%);
  padding: 8px 22px 8px 10px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.scard:hover { border-color: #55617a; border-left-color: var(--gold2); }
.scard .rank {
  font-size: 22px; font-weight: 800; font-style: italic; color: var(--gold);
  width: 24px; flex: none; text-align: center;
  text-shadow: 0 0 12px rgba(245,185,66,0.4);
}
.scard .pf { width: 46px; height: 46px; }
.scard .hname { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: 0.05em; width: 118px; flex: none; }
.scard .hrole { font-size: 9px; color: var(--dim); display: block; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
.chip {
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  padding: 3px 10px; background: #0b0f15; border: 1px solid var(--line);
  clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
}
.chip.good { color: var(--green); border-color: #1c5a38; background: #0a1810; }
.chip.warn { color: #ff7373; border-color: #6b2626; background: #1c0d0d; }
.chip.map { color: var(--gold2); border-color: #6b5320; background: #1a1408; }
.chip.neutral { color: var(--dim); }
.scard .pickbtn {
  background: linear-gradient(180deg, var(--gold2), #d99a26);
  border: 1px solid #ffe6a8; color: #241a06;
  font-weight: 800; letter-spacing: 0.14em; font-size: 12px;
  clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  padding: 7px 18px;
}
.scard .pickbtn:hover { background: linear-gradient(180deg, #ffe9b0, var(--gold)); color: #1a1204; }

/* ---- build panel ---- */
.buildbox { border-top-color: var(--green); }
.bhead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.bhead .pf { width: 48px; height: 48px; border-color: var(--green); }
.bhead h2 { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.14em; color: var(--green); text-shadow: 0 0 10px rgba(53,208,127,0.3); }
.bhead .note { font-size: 12px; color: var(--gold2); }
.btier { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; border-bottom: 1px dashed #232b37; }
.btier .t {
  font-size: 10px; font-weight: 800; color: #241a06; width: 26px; flex: none; text-align: center;
  background: linear-gradient(180deg, var(--gold2), var(--gold));
  clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
  padding: 2px 0; margin-top: 1px;
}
.btier .ti { width: 30px; height: 30px; border-radius: 5px; border: 1px solid var(--line); flex: none; object-fit: cover; }
.btier .n { font-weight: 800; text-transform: uppercase; font-size: 12.5px; letter-spacing: 0.03em; width: 150px; flex: none; }
.btier .d { font-size: 11px; color: var(--dim); flex: 1; }
.goals { margin-top: 12px; }
.goals h3 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.24em; color: var(--gold2); margin-bottom: 7px; }
.goal { display: flex; gap: 9px; align-items: baseline; padding: 3px 0; }
.goal .ph { font-size: 9px; font-weight: 800; width: 54px; flex: none; text-transform: uppercase; letter-spacing: 0.1em; }
.goal .ph.early { color: var(--green); } .goal .ph.mid { color: var(--gold); } .goal .ph.late { color: #9db7ff; } .goal .ph.fight { color: #ff7373; } .goal .ph.setup { color: #4fd1c5; } .goal .ph.trait { color: #b794f6; }

/* ============ HERO POOL (inline picker) ============ */
#poolBox input { width: 100%; margin-bottom: 12px; font-size: 14px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; max-height: 480px; overflow-y: auto; padding-right: 4px; }
.hopt {
  background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 40%), #10151d;
  border: 1px solid var(--line);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  padding: 8px 4px; cursor: pointer;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; text-align: center;
}
.hopt:hover { border-color: var(--gold); background: #191509; }
.hopt .pf { width: 54px; height: 54px; margin: 0 auto 5px; display: block; }
.hopt .r { display: block; font-size: 8px; color: var(--dim); font-weight: 600; letter-spacing: 0.12em; }
.hopt.taken { opacity: 0.22; pointer-events: none; filter: grayscale(1); }
.hopt { position: relative; }
.hopt.rec {
  border: 1px solid var(--gold); background: linear-gradient(180deg, rgba(245,185,66,0.10), transparent 55%), #191509;
  box-shadow: 0 0 12px rgba(245,185,66,0.25);
}
.recbadge {
  position: absolute; top: 3px; left: 5px;
  font-size: 10px; font-weight: 800; font-style: italic; color: var(--gold2);
  text-shadow: 0 0 8px rgba(245,185,66,0.6);
}
.note { color: var(--dim); font-size: 12px; text-transform: none; letter-spacing: normal; }

/* ---- role border colors ---- */
.roleTank .pf { border-color: #6d8dc7; } .roleHealer .pf { border-color: #4d9e6a; }
.roleBruiser .pf { border-color: #c78f4a; } .roleRA .pf { border-color: #b05c8f; }
.roleMA .pf { border-color: #a34d4d; } .roleSupport .pf { border-color: #7a6dc7; }
</style>
</head>
<body>
<div class="hud top">
  <h1>⚔️ KANEKO<span>DRAFTS</span></h1>
  <div class="controls">
    <select id="mapSel"></select>
    <select id="firstPick">
      <option value="blue">Blue picks first</option>
      <option value="red">Red picks first</option>
    </select>
    <button id="resetBtn">Reset draft</button>
  </div>
</div>

<div class="phasebar">
  <div class="pwing wblue"></div>
  <div class="pcenter"><span class="phase" id="phase"></span></div>
  <div class="pwing wred"></div>
</div>

<div class="layout">
  <div class="teamcol blue">
    <h2>Blue team <button class="mine" id="mineBlue">MY TEAM</button></h2>
    <div id="blueSlots"></div>
  </div>
  <div class="mid">
    <div class="sugg">
      <h2 id="suggTitle">Suggestions</h2>
      <div id="suggList"><p class="note">Set the map, mark your team, then click any slot to start assigning. Suggestions update every pick.</p></div>
    </div>
    <div class="sugg" id="poolBox">
      <h2>All heroes</h2>
      <input id="search" placeholder="Search hero... (recommended picks glow gold)">
      <div class="hgrid" id="hgrid"></div>
    </div>
    <div class="buildbox" id="buildBox" style="display:none">
      <div class="bhead"><img class="pf" id="buildPf" alt=""><div><h2 id="buildTitle">Build</h2><span class="note" id="buildNote"></span></div></div>
      <div id="buildList"></div>
      <div class="goals"><h3>Game plan</h3><div id="goalList"></div></div>
    </div>
  </div>
  <div class="teamcol red">
    <h2>Red team <button class="mine off" id="mineRed">MY TEAM</button></h2>
    <div id="redSlots"></div>
  </div>
</div>

:"Cryo-Freeze (trait): freeze to break CC and survive burst, but you can't act while frozen, so time it to bait key cooldowns and thaw into the follow-up.","build_why":["Buffs your main setup, more Blizzard damage and a beefier stun to lock a clump for your team.","Stronger blind for peel and it shuts off forts, take it for both teamfight and siege pressure.","Turns Blizzard into a defensive zone, drop it on your team to gut their burst in a fight.","Your grab-and-displace ult, roll their backline into your team or peel a whole dive off your carry.","Refreshes your abilities while invulnerable, freeze mid-fight then come out with everything up.","Double blind uptime, lock down two auto-attackers or extend your peel across a longer fight.","A free second life every fight, bait their whole combo then walk away, cementing your unkillable peel."]}},"mapsig":{"Alterac Pass":["dehaka","falstad","brightwing","sonya","imperius","artanis"],"Battlefield of Eternity":["valla","raynor","hanzo","tychus","zuljin","greymane","whitemane","auriel"],"Braxis Holdout":["zagara","sylvanas","nazeebo","guldan","kaelthas","jaina"],"Cursed Hollow":["jaina","kaelthas","azmodan","zagara","kerrigan","garrosh"],"Dragon Shire":["samuro","falstad","dehaka","sonya","genji","tracer"],"Garden of Terror":["nazeebo","zagara","sylvanas","xul","guldan","azmodan"],"Hanamura Temple":["sgthammer","azmodan","hanzo","dehaka","falstad","guldan"],"Haunted Mines":["sylvanas","zagara","jaina","kaelthas","nazeebo","tychus"],"Infernal Shrines":["azmodan","sylvanas","zagara","jaina","nazeebo","guldan","kaelthas"],"Sky Temple":["abathur","dehaka","falstad","zagara","nazeebo","xul","sylvanas"],"Tomb of the Spider Queen":["kaelthas","jaina","sylvanas","guldan","azmodan","zagara"],"Towers of Doom":["sylvanas","azmodan","falstad","dehaka","brightwing","kaelthas"],"Volskaya Foundry":["kaelthas","jaina","kerrigan","malthael","johanna","diablo"],"Warhead Junction":["dehaka","falstad","brightwing","abathur","lostvikings","zagara"]}};
const MAPS = ["Alterac Pass","Battlefield of Eternity","Braxis Holdout","Cursed Hollow","Dragon Shire","Garden of Terror","Hanamura Temple","Haunted Mines","Infernal Shrines","Sky Temple","Tomb of the Spider Queen","Towers of Doom","Volskaya Foundry","Warhead Junction"];
const TIER_SCORE = { S: 3, A: 2, B: 1, C: 0 };
const TIERS = ["1","4","7","10","13","16","20"];
// Storm League: 2 alternating bans, 1-2-2 picks, 1 ban each, 2-2-1 picks
const ORDER = [
  {t:"F", k:"ban"}, {t:"S", k:"ban"}, {t:"F", k:"ban"}, {t:"S", k:"ban"},
  {t:"F", k:"pick"}, {t:"S", k:"pick"}, {t:"S", k:"pick"},
  {t:"F", k:"pick"}, {t:"F", k:"pick"},
  {t:"S", k:"ban"}, {t:"F", k:"ban"},
  {t:"S", k:"pick"}, {t:"S", k:"pick"},
  {t:"F", k:"pick"}, {t:"F", k:"pick"},
  {t:"S", k:"pick"},
];
const ROLE_CLS = { "Tank":"roleTank", "Healer":"roleHealer", "Bruiser":"roleBruiser", "Ranged Assassin":"roleRA", "Melee Assassin":"roleMA", "Support":"roleSupport" };

let state = { map: MAPS[3], first: "blue", mine: "blue", slots: [], activeIdx: null };

function roleOf(h) { return DATA.talents[h].expandedRole || DATA.talents[h].role; }
function nameOf(h) { return DATA.talents[h].name; }
function pfImg(h, cls) { return '<img class="pf" src="img/' + h + '.png" alt="" loading="lazy">'; }

function teams() {
  const F = state.first, S = F === "blue" ? "red" : "blue";
  return ORDER.map(o => ({ team: o.t === "F" ? F : S, kind: o.k }));
}
function initSlots() {
  state.slots = teams().map(t => ({ ...t, hero: null }));
  state.activeIdx = 0;
}
function nextEmpty() {
  const i = state.slots.findIndex(s => !s.hero);
  return i === -1 ? null : i;
}
function taken() { return new Set(state.slots.filter(s => s.hero).map(s => s.hero)); }
function teamHeroes(team, kind) { return state.slots.filter(s => s.team === team && s.kind === kind && s.hero).map(s => s.hero); }

function compNeeds(allies) {
  const roles = allies.map(roleOf);
  const tags = k => allies.reduce((a, h) => a + (DATA.meta[h].tags[k] || 0), 0);
  return {
    needTank: !roles.includes("Tank"),
    needHeal: !roles.includes("Healer"),
    needSolo: !roles.includes("Bruiser"),
    ranged: roles.filter(r => r === "Ranged Assassin").length,
    wc: tags("wc"), cc: tags("cc"),
    count: allies.length,
  };
}

// Graded map fit: a hero that DEFINES the map (signature) gets a big bonus so
// it outranks a generically-strong hero there, even at a lower tier; a hero
// that is merely good on the map gets a medium bonus. Flat bonuses let raw
// tier dominate inside a map, which buried the real map-defining picks.
function mapFit(slug) {
  const sig = (DATA.mapsig && DATA.mapsig[state.map]) || [];
  if (sig.includes(slug)) return { pts: 2.8, chip: { c: "map", t: "defines this map" } };
  if ((DATA.meta[slug].maps || []).includes(state.map)) return { pts: 1.3, chip: { c: "map", t: "strong on this map" } };
  return null;
}

function score(slug, allies, enemies) {
  const m = DATA.meta[slug];
  const role = roleOf(slug);
  let pts = TIER_SCORE[m.tier] ?? 1;
  const chips = [];
  if (m.tier === "S" || m.tier === "A") chips.push({ c: "neutral", t: m.tier + "-tier" });
  const mf = mapFit(slug);
  if (mf) { pts += mf.pts; chips.push(mf.chip); }
  const needs = compNeeds(allies);
  // core roles get more urgent the deeper the draft goes
  const urgency = 1.6 + 0.7 * needs.count;
  if (needs.needTank && role === "Tank") { pts += urgency; chips.push({ c: "good", t: "you need a tank" }); }
  if (needs.needHeal && role === "Healer") { pts += urgency; chips.push({ c: "good", t: "you need a healer" }); }
  if (needs.needSolo && role === "Bruiser" && needs.count >= 1) { pts += 1.6 + 0.4 * needs.count; chips.push({ c: "good", t: "you need a solo laner" }); }
  if (!needs.needTank && role === "Tank") pts -= 1.4;
  if (!needs.needHeal && role === "Healer") pts -= 1.4;
  if (needs.ranged >= 2 && role === "Ranged Assassin") { pts -= 2.2; chips.push({ c: "warn", t: "3rd ranged, comp gets soft" }); }
  if (needs.count >= 3 && needs.ranged === 0 && role === "Ranged Assassin") { pts += 1.5; chips.push({ c: "good", t: "you need ranged damage" }); }
  if (needs.count >= 2 && needs.wc === 0 && (m.tags.wc || 0) > 0) { pts += 1.0; chips.push({ c: "good", t: "adds waveclear" }); }
  if (needs.count >= 3 && needs.cc === 0 && (m.tags.cc || 0) > 1) { pts += 0.8; chips.push({ c: "good", t: "adds lockdown" }); }
  for (const a of allies) {
    if ((m.syn || []).includes(a) || (DATA.meta[a].syn || []).includes(slug)) {
      pts += 1.2; chips.push({ c: "good", t: "synergy: " + nameOf(a) });
    }
  }
  for (const e of enemies) {
    if ((m.beats || []).includes(e)) { pts += 1.0; chips.push({ c: "good", t: "counters " + nameOf(e) }); }
    if ((DATA.meta[e].beats || []).includes(slug) || (m.loses || []).includes(e)) {
      pts -= 1.5; chips.push({ c: "warn", t: "countered by " + nameOf(e) });
    }
  }
  return { pts, chips };
}

function suggest() {
  const box = document.getElementById("suggList");
  const title = document.getElementById("suggTitle");
  const idx = state.activeIdx;
  if (idx === null) { title.textContent = "Draft complete"; box.innerHTML = '<p class="note">All slots filled. Click any hero on either team for their build and game plan.</p>'; return; }
  const slot = state.slots[idx];
  const isMine = slot.team === state.mine;
  const allies = teamHeroes(state.mine, "pick");
  const enemies = teamHeroes(state.mine === "blue" ? "red" : "blue", "pick");
  const tk = taken();
  const cands = Object.keys(DATA.meta).filter(h => !tk.has(h));
  if (slot.kind === "ban") {
    title.textContent = (isMine ? "Your ban" : "Their ban") + " · best targets vs " + (isMine ? "them" : "you");
    // A ban denies a hero to the OTHER team, so aim it at what that team still
    // needs (deny their next pick) and at counters to the banning team. Do not
    // recommend banning a role they have already filled.
    const victim = isMine ? enemies : allies;      // whose future pick we deny
    const ownAllies = isMine ? allies : enemies;   // who we protect
    const vRoles = victim.map(roleOf);
    const vNoTank = !vRoles.includes("Tank");
    const vNoHeal = !vRoles.includes("Healer");
    const vNoFront = vNoTank && !vRoles.includes("Bruiser");
    const scored = cands.map(h => {
      const m = DATA.meta[h];
      const role = roleOf(h);
      let pts = TIER_SCORE[m.tier] ?? 1;
      const chips = [];
      const mf = mapFit(h);
      if (mf) { pts += mf.pts; chips.push(mf.chip); }
      if (vNoFront && (role === "Tank" || role === "Bruiser")) { pts += 1.8; chips.push({ c: "good", t: "denies their frontline" }); }
      if (vNoHeal && role === "Healer") { pts += 1.8; chips.push({ c: "good", t: "denies their healer" }); }
      if (!vNoHeal && role === "Healer") pts -= 1.6;   // they already have a healer
      if (!vNoTank && role === "Tank") pts -= 0.8;      // they already have a tank
      for (const a of ownAllies) if ((m.beats || []).includes(a)) { pts += 1.3; chips.push({ c: "warn", t: "hurts your " + nameOf(a) }); }
      if (m.tier === "S") chips.unshift({ c: "neutral", t: "S-tier, deny it" });
      return { h, pts, chips };
    }).sort((a, b) => b.pts - a.pts).slice(0, 5);
    state.top5 = scored.map(s => s.h);
    render(scored, idx, "BAN");
    return;
  }
  title.textContent = isMine ? "Best picks for YOUR team" : "Likely enemy picks (their view)";
  const myAllies = isMine ? allies : enemies;
  const myEnemies = isMine ? enemies : allies;
  const scored = cands.map(h => ({ h, ...score(h, myAllies, myEnemies) }))
    .sort((a, b) => b.pts - a.pts).slice(0, 5);
  state.top5 = scored.map(s => s.h);
  render(scored, idx, "PICK");
}

function render(scored, idx, verb) {
  const box = document.getElementById("suggList");
  box.innerHTML = "";
  scored.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "scard " + (ROLE_CLS[roleOf(s.h)] || "");
    d.innerHTML = '<div class="rank">' + (i + 1) + '</div>' + pfImg(s.h) +
      '<div class="hname">' + nameOf(s.h) + '<span class="hrole">' + roleOf(s.h) + '</span></div>' +
      '<div class="chips">' + s.chips.slice(0, 4).map(c => '<span class="chip ' + c.c + '">' + c.t + '</span>').join("") + '</div>';
    const b = document.createElement("button");
    b.className = "pickbtn"; b.textContent = verb;
    b.onclick = () => assign(idx, s.h);
    d.appendChild(b);
    box.appendChild(d);
  });
}

function assign(idx, hero) {
  state.slots[idx].hero = hero;
  if (state.slots[idx].kind === "pick" && state.slots[idx].team === state.mine) showBuild(hero);
  state.activeIdx = nextEmpty();
  if (state.activeIdx === null && state.lastShown) showBuild(state.lastShown);
  draw();
}

const MAP_OBJ = {
  "Alterac Pass": "the cavalry captains", "Battlefield of Eternity": "your immortal",
  "Braxis Holdout": "the beacons", "Cursed Hollow": "each tribute", "Dragon Shire": "both shrines then the dragon",
  "Garden of Terror": "the seeds", "Hanamura Temple": "the payload", "Haunted Mines": "the mines and the golem",
  "Infernal Shrines": "the punisher shrine", "Sky Temple": "the firing temples", "Tomb of the Spider Queen": "gem turn-ins",
  "Towers of Doom": "the altars", "Volskaya Foundry": "the capture point", "Warhead Junction": "the warheads",
};
function tierRank(h) { return { S: 3, A: 2, B: 1, C: 0 }[DATA.meta[h].tier] ?? 1; }
function goalsFor(hero, allies, enemies) {
  const m = DATA.meta[hero], role = roleOf(hero), kit = m.kit || {};
  const plan = m.plan || {};
  const g = [];
  const obj = MAP_OBJ[state.map] || "the objective";
  const carry = enemies.filter(e => roleOf(e) === "Ranged Assassin").sort((a, b) => tierRank(b) - tierRank(a))[0]
    || enemies.filter(e => ["Melee Assassin", "Bruiser"].includes(roleOf(e))).sort((a, b) => tierRank(b) - tierRank(a))[0];
  const diver = enemies.find(e => (DATA.meta[e].tags.dive || 0) > 0 || roleOf(e) === "Melee Assassin");
  // EARLY: the hero's own coaching, plus their solo matchup profile when relevant
  const otherSolo = allies.some(a => roleOf(a) === "Bruiser");
  g.push(["early", plan.early || "Trade evenly, arrive at 10 healthy and even in XP"]);
  if (role === "Bruiser" && !otherSolo && m.solo) g.push(["early", m.solo]);
  // MID: hero coaching + this map's objective
  g.push(["mid", (plan.mid || "Group at 10 and take the fight.") + " This map: " + obj + "."]);
  // FIGHTS: hero job, then draft-specific target/threat lines
  g.push(["fight", plan.fight || "Play your role in the fight"]);
  // YOUR TRAIT: skill-expression play; for reactive traits (cleanse/peel/save)
  // name the actual enemy dive/lockdown threats in THIS draft.
  const traitTip = m.trait_tip || "";
  if (traitTip) {
    let line = traitTip;
    const reactive = /purge|cleanse|unstoppable|protect|\bsave\b|peel|bubble|shield|block|body|dispel|deny/i.test(traitTip);
    if (reactive) {
      const danger = enemies.filter(e => (DATA.meta[e].tags.dive || 0) > 0
        || roleOf(e) === "Melee Assassin" || (DATA.meta[e].tags.cc || 0) >= 2);
      if (danger.length) line += " This game the danger is their " + danger.slice(0, 2).map(nameOf).join(" and ") + ".";
    }
    g.push(["trait", line]);
  }
  // YOUR TEAM: specific setups from allies actually drafted (spec combos)
  const combos = m.combos || {};
  allies.filter(a => combos[a]).slice(0, 2).forEach(a => g.push(["setup", combos[a]]));
  if (kit.cc && (diver || carry)) {
    const target = diver && role !== "Tank" ? nameOf(diver) : (carry ? nameOf(carry) : nameOf(diver));
    g.push(["fight", "This game: save " + kit.cc + " for " + target + (diver && target === nameOf(diver) ? " the moment they jump in" : "")]);
  }
  const threats = enemies.filter(e => (DATA.meta[e].beats || []).includes(hero) || (m.loses || []).includes(e));
  const prey = enemies.filter(e => (m.beats || []).includes(e));
  if (threats.length) g.push(["fight", "Respect " + threats.map(nameOf).join(" and ") + ", they counter you"]);
  if (prey.length) g.push(["fight", "Punish " + prey.map(nameOf).join(" and ") + " every time they show"]);
  // LATE
  g.push(["late", plan.late || "Don't get caught alone, one death past 20 loses the game"]);
  return g;
}

function showBuild(hero) {
  state.lastShown = hero;
  const m = DATA.meta[hero], t = DATA.talents[hero];
  const bb = document.getElementById("buildBox");
  bb.style.display = "block";
  document.getElementById("buildPf").src = "img/" + hero + ".png";
  document.getElementById("buildTitle").textContent = t.name + " · " + roleOf(hero);
  document.getElementById("buildNote").textContent = m.note || "";
  const list = document.getElementById("buildList");
  list.innerHTML = "";
  const bicons = m.build_icons || [], bwhy = m.build_why || [];
  m.build.forEach((name, i) => {
    const tier = TIERS[i];
    const tal = (t.talents[tier] || []).find(x => x.name === name);
    const row = document.createElement("div");
    row.className = "btier";
    const ic = bicons[i] ? '<img class="ti" src="img/talents/' + bicons[i] + '" alt="" loading="lazy">' : '';
    // Why you pick it (the pick reason), not the vanilla tooltip.
    const why = bwhy[i] || (tal ? tal.description : "");
    row.innerHTML = '<span class="t">' + tier + '</span>' + ic + '<span class="n">' + name + '</span>' +
      '<span class="d">' + why + '</span>';
    list.appendChild(row);
  });
  const heroTeam = state.slots.find(s => s.hero === hero && s.kind === "pick");
  const team = heroTeam ? heroTeam.team : state.mine;
  const allies = teamHeroes(team, "pick").filter(h => h !== hero);
  const enemies = teamHeroes(team === "blue" ? "red" : "blue", "pick");
  const gl = document.getElementById("goalList");
  gl.innerHTML = "";
  if (state.activeIdx !== null) {
    gl.innerHTML = '<div class="goal"><span>Game plan unlocks when the draft is complete</span></div>';
    return;
  }
  goalsFor(hero, allies, enemies).forEach(([ph, txt]) => {
    const d = document.createElement("div");
    d.className = "goal";
    d.innerHTML = '<span class="ph ' + ph + '">' + (ph === "fight" ? "fights" : ph) + '</span><span>' + txt + '</span>';
    gl.appendChild(d);
  });
}

function draw() {
  for (const team of ["blue", "red"]) {
    const el = document.getElementById(team + "Slots");
    el.innerHTML = "";
    state.slots.forEach((s, i) => {
      if (s.team !== team) return;
      const d = document.createElement("div");
      d.className = "slot " + s.kind + (i === state.activeIdx ? " active" : "") + " " + (s.hero ? (ROLE_CLS[roleOf(s.hero)] || "") : "");
      d.innerHTML = '<span class="lbl">' + (s.kind === "ban" ? "BAN" : "PICK") + '</span>' +
        (s.hero ? pfImg(s.hero) : "") +
        '<span class="who ' + (s.hero ? "" : "empty") + '">' +
        (s.hero ? nameOf(s.hero) + '<span class="r">' + roleOf(s.hero) + '</span>' : "· · ·") + '</span>' +
        (s.hero ? '<span class="x" title="clear">✕</span>' : "");
      d.onclick = ev => {
        if (ev.target.classList.contains("x")) { s.hero = null; state.activeIdx = i; draw(); return; }
        if (s.hero) { if (s.kind === "pick") showBuild(s.hero); return; }
        state.activeIdx = i;
        draw(); document.getElementById("search").focus();
      };
      el.appendChild(d);
    });
  }
  const idx = state.activeIdx;
  document.getElementById("phase").textContent = idx === null ? "DRAFT COMPLETE" :
    "Now: " + state.slots[idx].team.toUpperCase() + " " + state.slots[idx].kind.toUpperCase() +
    (state.slots[idx].team === state.mine ? " (you)" : "");
  document.getElementById("mineBlue").className = "mine" + (state.mine === "blue" ? "" : " off");
  document.getElementById("mineRed").className = "mine" + (state.mine === "red" ? "" : " off");
  suggest();
  fillGrid(document.getElementById("search").value);
}

function fillGrid(q) {
  const grid = document.getElementById("hgrid");
  grid.innerHTML = "";
  const tk = taken();
  const rec = state.top5 || [];
  // recommended first (in rank order), then the rest alphabetically
  const rest = Object.keys(DATA.talents).filter(h => !rec.includes(h))
    .sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
  rec.concat(rest).forEach(h => {
    const nm = nameOf(h);
    if (q && !nm.toLowerCase().includes(q.toLowerCase())) return;
    const ri = rec.indexOf(h);
    const d = document.createElement("div");
    d.className = "hopt " + (ROLE_CLS[roleOf(h)] || "") + (tk.has(h) ? " taken" : "") +
      (ri >= 0 && !tk.has(h) ? " rec" : "");
    d.title = DATA.meta[h].tier + "-tier · " + (DATA.meta[h].why || "");
    d.innerHTML = (ri >= 0 && !tk.has(h) ? '<span class="recbadge">' + (ri + 1) + '</span>' : "") +
      pfImg(h) + nm + '<span class="r">' + roleOf(h) + " · " + DATA.meta[h].tier + '</span>';
    d.onclick = () => { if (state.activeIdx !== null) assign(state.activeIdx, h); };
    grid.appendChild(d);
  });
}

// wire up
// deep-link a map via ?map=<name> (also lets the harness screenshot a map)
try { const mp = new URLSearchParams(location.search).get("map"); if (mp && MAPS.includes(mp)) state.map = mp; } catch (e) {}
const mapSel = document.getElementById("mapSel");
MAPS.forEach(m => { const o = document.createElement("option"); o.textContent = m; mapSel.appendChild(o); });
mapSel.value = state.map;
mapSel.onchange = () => { state.map = mapSel.value; draw(); };
document.getElementById("firstPick").onchange = e => { state.first = e.target.value; initSlots(); draw(); };
document.getElementById("mineBlue").onclick = () => { state.mine = "blue"; draw(); };
document.getElementById("mineRed").onclick = () => { state.mine = "red"; draw(); };
document.getElementById("resetBtn").onclick = () => { initSlots(); document.getElementById("buildBox").style.display = "none"; draw(); };
document.getElementById("search").oninput = e => fillGrid(e.target.value);

initSlots(); draw();

// ponytail: #demo auto-plays 9 actions then stops (mid-draft shot); #demofull plays the whole draft (game-plan shot)
if (location.hash === "#demo" || location.hash === "#demofull") {
  const steps = location.hash === "#demofull" ? 16 : 9;
  for (let i = 0; i < steps && state.activeIdx !== null; i++) {
    const top = document.querySelector("#suggList .scard .hname");
    const slug = Object.keys(DATA.talents).find(h => nameOf(h) === top.childNodes[0].textContent);
    assign(state.activeIdx, slug);
  }
}
// ponytail: headless smoke test — #selftest auto-drafts by always taking suggestion #1
if (location.hash === "#selftest") {
  try {
    const log = [];
    while (state.activeIdx !== null) {
      const idx = state.activeIdx, slot = state.slots[idx];
      const top = document.querySelector("#suggList .scard .hname");
      if (!top) throw new Error("no suggestion at slot " + idx);
      const name = top.childNodes[0].textContent;
      const slug = Object.keys(DATA.talents).find(h => nameOf(h) === name);
      log.push(slot.team + " " + slot.kind + ": " + name + " (" + roleOf(slug) + ")");
      assign(idx, slug);
    }
    if (state.slots.some(s => !s.hero)) throw new Error("unfilled slot");
    const all = state.slots.map(s => s.hero);
    if (new Set(all).size !== 16) throw new Error("duplicate hero");
    for (const team of ["blue", "red"]) {
      const roles = teamHeroes(team, "pick").map(roleOf);
      if (!roles.includes("Tank")) throw new Error(team + " has no tank");
      if (!roles.includes("Healer")) throw new Error(team + " has no healer");
      if (roles.filter(r => r === "Ranged Assassin").length > 2) throw new Error(team + " has 3+ ranged");
    }
    document.title = "SELFTEST OK";
    document.body.innerHTML = '<pre style="font-size:15px;color:#22c55e">SELFTEST OK\n' + log.join("\n") + '</pre>';
  } catch (e) { document.body.innerHTML = '<pre style="font-size:18px;color:#ef4444">SELFTEST FAIL: ' + e.message + '</pre>'; }
}
</script>
