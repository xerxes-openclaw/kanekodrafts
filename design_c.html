<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanekodrafts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #04060b;
  --blue: #3aa0ff; --blue-glow: rgba(45,130,255,0.45);
  --red: #ff4655; --red-glow: rgba(255,70,85,0.4);
  --gold: #f2c464; --gold-glow: rgba(242,196,100,0.35);
  --green: #3ddc84; --amber: #ffc95c;
  --text: #eef2f9; --dim: #8b95aa;
  --line: rgba(255,255,255,0.08); --line-bright: rgba(255,255,255,0.2);
  --panel: rgba(13,17,27,0.6);
  --tank: #6aa6ff; --healer: #43cf8c; --bruiser: #f0a35e;
  --ra: #d977c6; --ma: #ff7a6e; --support: #8f86ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.5 "Bahnschrift", "Segoe UI", "Arial Narrow", Arial, sans-serif;
  padding: 20px; min-height: 100vh;
}
/* cinematic split lighting: blue bleed left, red bleed right */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(1000px 780px at -8% 42%, rgba(38,118,255,0.26), transparent 62%),
    radial-gradient(1000px 780px at 108% 42%, rgba(255,58,72,0.22), transparent 62%),
    radial-gradient(1400px 520px at 50% -12%, rgba(130,165,255,0.07), transparent 70%),
    linear-gradient(180deg, #05070d 0%, #04060b 55%, #030408 100%);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(58,160,255,0.5), transparent 2px) left/3px 100% no-repeat,
    linear-gradient(270deg, rgba(255,70,85,0.45), transparent 2px) right/3px 100% no-repeat;
  filter: blur(1px);
}
h1 { font-size: 19px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; white-space: nowrap; }
h1 span { color: var(--gold); text-shadow: 0 0 18px var(--gold-glow); }

/* ---- broadcast top bar ---- */
.top {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-bottom: 16px; padding: 12px 18px; position: relative;
  background-color: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background-image: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 45%);
  border: 1px solid var(--line); border-radius: 4px;
}
.top::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, var(--blue-glow), rgba(255,255,255,0.25) 50%, var(--red-glow));
}
select, button, input {
  background: rgba(9,12,20,0.75); color: var(--text);
  border: 1px solid var(--line-bright); border-radius: 3px;
  padding: 8px 12px; font: inherit; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em;
}
select:focus, input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold-glow); }
button { cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
button:hover { border-color: var(--gold); box-shadow: 0 0 12px var(--gold-glow); }
.phase {
  align-self: center; display: inline-flex; align-items: center; gap: 12px;
  font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.22em;
  padding: 11px 32px; border-radius: 999px;
  background: rgba(242,196,100,0.1); border: 1px solid var(--gold); color: var(--gold);
  box-shadow: 0 0 20px var(--gold-glow);
}
.phase::before {
  content: ""; width: 9px; height: 9px; border-radius: 50%; flex: none;
  background: currentColor; box-shadow: 0 0 10px currentColor;
  animation: pulse 1.6s ease-in-out infinite;
}
.phase.p-blue {
  background: linear-gradient(180deg, #58b2ff, #2a7fe0); border-color: var(--blue);
  color: #041022; box-shadow: 0 0 30px var(--blue-glow);
}
.phase.p-red {
  background: linear-gradient(180deg, #ff6572, #dd2f3c); border-color: var(--red);
  color: #210507; box-shadow: 0 0 30px var(--red-glow);
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ---- layout ---- */
.layout { display: grid; grid-template-columns: 292px 1fr 292px; gap: 16px; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr 1fr; } .mid { grid-column: 1 / -1; order: -1; } }

/* ---- glass panels ---- */
.teamcol, .sugg, .buildbox {
  position: relative;
  background-color: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 8px),
    linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0) 42%);
  border: 1px solid var(--line); border-radius: 4px; padding: 14px;
}
.teamcol::before, .sugg::before, .buildbox::before {
  content: ""; position: absolute; top: -1px; left: -1px; right: -1px; height: 2px; border-radius: 2px 2px 0 0;
}
.blue::before { background: linear-gradient(90deg, var(--blue), rgba(58,160,255,0.05)); box-shadow: 0 0 14px var(--blue-glow); }
.red::before { background: linear-gradient(270deg, var(--red), rgba(255,70,85,0.05)); box-shadow: 0 0 14px var(--red-glow); }
.sugg::before { background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent); box-shadow: 0 0 14px var(--gold-glow); }
.buildbox::before { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5) 50%, transparent); }

.teamcol h2 {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.24em;
  margin-bottom: 12px; padding: 8px 10px;
  display: flex; justify-content: space-between; align-items: center;
  position: relative;
}
.teamcol h2::before { content: ""; position: absolute; inset: 0; z-index: -1; }
.blue h2 { color: var(--blue); text-shadow: 0 0 16px var(--blue-glow); }
.blue h2::before {
  background: linear-gradient(90deg, rgba(58,160,255,0.22), rgba(58,160,255,0.04));
  clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
}
.red h2 { color: var(--red); text-shadow: 0 0 16px var(--red-glow); }
.red h2::before {
  background: linear-gradient(270deg, rgba(255,70,85,0.22), rgba(255,70,85,0.04));
  clip-path: polygon(0 0, 100% 0, 100% 100%, 16px 100%);
}

.mine {
  font-size: 9px; font-weight: 700; letter-spacing: 0.16em;
  border: 1px solid transparent; border-radius: 2px; padding: 4px 8px;
}
.blue .mine { background: var(--blue); color: #04101f; border-color: var(--blue); box-shadow: 0 0 12px var(--blue-glow); }
.red .mine { background: var(--red); color: #1f0507; border-color: var(--red); box-shadow: 0 0 12px var(--red-glow); }
.mine.off { background: transparent; color: var(--dim); border: 1px solid var(--line-bright); box-shadow: none; }

/* ---- draft slots ---- */
.slot {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 3px;
  padding: 7px 10px; margin-bottom: 8px; min-height: 60px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.slot:hover { border-color: var(--line-bright); background: rgba(255,255,255,0.055); }
.slot.ban { border-style: dashed; background: rgba(255,255,255,0.015); }
.slot.ban img { filter: grayscale(1) brightness(1.4); }
.slot.ban .lbl { color: var(--red); }
.slot.ban:has(img) { position: relative; }
.slot.ban:has(img)::after {
  content: ""; position: absolute; left: 52px; top: 50%; margin-top: -23px;
  width: 46px; height: 46px; pointer-events: none; border-radius: 5px;
  background: linear-gradient(45deg, transparent 43%, rgba(255,70,85,0.95) 46%, rgba(255,70,85,0.95) 54%, transparent 57%);
}
.blue .slot:has(.pf) { border-left: 3px solid var(--blue); }
.red .slot:has(.pf) { border-left: 3px solid var(--red); }
.slot.active {
  border: 2px solid var(--gold); padding: 6px 9px;
  background: rgba(242,196,100,0.06);
  box-shadow: 0 0 10px rgba(255,200,90,0.45);
  animation: pulse-b 2.4s ease-in-out infinite;
}
@keyframes pulse-b { 0%,100% { box-shadow: 0 0 10px rgba(255,200,90,0.45); } 50% { box-shadow: 0 0 3px rgba(255,200,90,0.12); } }
.slot.active .lbl { color: var(--gold); }
.slot .lbl { font-size: 9px; font-weight: 700; color: var(--dim); width: 32px; flex: none; text-transform: uppercase; letter-spacing: 0.16em; }
.pf {
  width: 46px; height: 46px; border-radius: 5px; flex: none; object-fit: cover;
  border: 2px solid var(--line-bright); background: #0a0d15;
}
.blue .slot .pf { border-color: var(--blue); box-shadow: 0 0 14px var(--blue-glow); }
.red .slot .pf { border-color: var(--red); box-shadow: 0 0 14px var(--red-glow); }
.slot .who { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
.slot .who .r { display: block; font-size: 9px; color: var(--dim); font-weight: 400; letter-spacing: 0.14em; }
.slot .who.empty { color: rgba(255,255,255,0.22); font-weight: 400; letter-spacing: 0.3em; }
.slot .x { margin-left: auto; color: var(--dim); font-size: 12px; padding: 0 4px; }
.slot .x:hover { color: var(--red); }

/* ---- suggestions ---- */
.mid { display: flex; flex-direction: column; gap: 16px; }
.sugg h2 {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.24em;
  color: var(--gold); text-shadow: 0 0 16px var(--gold-glow);
  margin-bottom: 12px; padding: 8px 12px; position: relative;
}
.sugg h2::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(90deg, rgba(242,196,100,0.16), rgba(242,196,100,0.02));
  clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
}
.scard {
  background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 3px;
  padding: 10px 14px; margin-bottom: 9px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  transition: border-color 0.15s;
}
.scard:hover { border-color: var(--line-bright); }
.scard .rank {
  font-size: 26px; font-weight: 300; color: var(--gold); width: 24px; flex: none;
  text-align: center; text-shadow: 0 0 14px var(--gold-glow);
}
.scard .pf { width: 62px; height: 62px; }
.scard .hname { font-weight: 700; font-size: 18px; width: 156px; flex: none; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.2; }
.scard .hrole { font-size: 10px; color: var(--dim); display: block; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
.chip {
  font-size: 12px; padding: 4px 11px; border-radius: 2px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--line);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.chip.good { color: var(--green); border-color: rgba(61,220,132,0.35); }
.chip.warn { color: var(--red); border-color: rgba(255,70,85,0.4); }
.chip.map { color: var(--amber); border-color: rgba(255,201,92,0.4); }
.chip.neutral { color: var(--dim); }
.scard .pickbtn {
  background: linear-gradient(180deg, #ffd98a, #e3a83f); border: 0; color: #201302;
  font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  border-radius: 3px; padding: 9px 16px; box-shadow: 0 0 14px rgba(242,196,100,0.2);
}
.scard .pickbtn:hover { box-shadow: 0 0 22px rgba(242,196,100,0.5); }

/* ---- build panel ---- */
.bhead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.bhead .pf { width: 58px; height: 58px; border-color: var(--gold); box-shadow: 0 0 16px var(--gold-glow); }
.bhead h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text); }
.bhead .note { font-size: 11px; color: var(--amber); letter-spacing: 0.04em; }
.btier { display: grid; grid-template-columns: 30px 168px 1fr; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); }
.btier:last-child { border-bottom: 0; }
.btier .t { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 0.08em; }
.btier .n { font-weight: 700; font-size: 13px; }
.btier .d { font-size: 11px; color: var(--dim); }
.goals { margin-top: 14px; }
.goals h3 {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.24em;
  color: var(--gold); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
}
.goal { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; }
.goal .ph { font-size: 10px; font-weight: 700; width: 56px; flex: none; text-transform: uppercase; letter-spacing: 0.1em; }
.goal .ph.early { color: var(--green); } .goal .ph.mid { color: var(--amber); } .goal .ph.late { color: var(--support); } .goal .ph.fight { color: var(--red); }

/* ---- hero picker modal ---- */
.modal {
  position: fixed; inset: 0; background: rgba(2,4,8,0.72);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: none; align-items: flex-start; justify-content: center; padding: 48px 18px; z-index: 10;
}
.modal.open { display: flex; }
.mbox {
  position: relative;
  background-color: rgba(11,15,24,0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  background-image: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 30%);
  border: 1px solid var(--line-bright); border-radius: 4px; padding: 16px;
  width: min(900px, 100%); max-height: 82vh; overflow: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 40px rgba(58,160,255,0.08), 0 0 40px rgba(255,70,85,0.06);
}
.mbox input { width: 100%; margin-bottom: 12px; font-size: 14px; letter-spacing: 0.1em; padding: 11px 14px; }
.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.hopt {
  background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 3px;
  padding: 10px 4px 8px; cursor: pointer; font-size: 10px; font-weight: 700;
  text-align: center; text-transform: uppercase; letter-spacing: 0.05em;
  transition: border-color 0.12s, background 0.12s;
}
.hopt:hover { border-color: var(--gold); background: rgba(242,196,100,0.06); }
.hopt .pf { width: 58px; height: 58px; margin: 0 auto 6px; display: block; }
.hopt .r { display: block; font-size: 8px; color: var(--dim); font-weight: 400; letter-spacing: 0.1em; margin-top: 2px; }
.hopt.taken { opacity: 0.2; pointer-events: none; filter: grayscale(1); }
.note { color: var(--dim); font-size: 12px; text-transform: none; letter-spacing: 0.02em; }

/* ---- role accents (rims outside team columns + role label tint) ---- */
.roleTank .pf { border-color: var(--tank); box-shadow: 0 0 10px rgba(106,166,255,0.3); }
.roleHealer .pf { border-color: var(--healer); box-shadow: 0 0 10px rgba(67,207,140,0.3); }
.roleBruiser .pf { border-color: var(--bruiser); box-shadow: 0 0 10px rgba(240,163,94,0.3); }
.roleRA .pf { border-color: var(--ra); box-shadow: 0 0 10px rgba(217,119,198,0.3); }
.roleMA .pf { border-color: var(--ma); box-shadow: 0 0 10px rgba(255,122,110,0.3); }
.roleSupport .pf { border-color: var(--support); box-shadow: 0 0 10px rgba(143,134,255,0.3); }
.roleTank .r, .roleTank .hrole { color: var(--tank); }
.roleHealer .r, .roleHealer .hrole { color: var(--healer); }
.roleBruiser .r, .roleBruiser .hrole { color: var(--bruiser); }
.roleRA .r, .roleRA .hrole { color: var(--ra); }
.roleMA .r, .roleMA .hrole { color: var(--ma); }
.roleSupport .r, .roleSupport .hrole { color: var(--support); }

/* scrollbars, keep them sleek */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }
</style>
</head>
<body>
<div class="top">
  <h1>⚔️ KANEKO<span>DRAFTS</span></h1>
  <select id="mapSel"></select>
  <select id="firstPick">
    <option value="blue">Blue picks first</option>
    <option value="red">Red picks first</option>
  </select>
  <button id="resetBtn">Reset draft</button>
</div>

<div class="layout">
  <div class="teamcol blue">
    <h2>Blue team <button class="mine" id="mineBlue">MY TEAM</button></h2>
    <div id="blueSlots"></div>
  </div>
  <div class="mid">
    <span class="phase" id="phase"></span>
    <div class="sugg">
      <h2 id="suggTitle">Suggestions</h2>
      <div id="suggList"><p class="note">Set the map, mark your team, then click any slot to start assigning. Suggestions update every pick.</p></div>
    </div>
    <div class="buildbox" id="buildBox" style="display:none">
      <div class="bhead"><img class="pf" id="buildPf" alt=""><div><h2 id="buildTitle">Build</h2><span class="note" id="buildNote"></span></div></div>
      <div id="buildList"></div>
      <div class="goals"><h3>Game plan</h3><div id="goalList"></div></div>
    </div>
  </div>
  <div class="teamcol red">
    <h2>Red team <button class="mine off" id="mineRed">MY TEAM</button></h2>
    <div id="redSlots"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <input id="search" placeholder="Search hero...">
    <div class="hgrid" id="hgrid"></div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/;
const MAPS = ["Alterac Pass","Battlefield of Eternity","Braxis Holdout","Cursed Hollow","Dragon Shire","Garden of Terror","Hanamura Temple","Haunted Mines","Infernal Shrines","Sky Temple","Tomb of the Spider Queen","Towers of Doom","Volskaya Foundry","Warhead Junction"];
const TIER_SCORE = { S: 3, A: 2, B: 1, C: 0 };
const TIERS = ["1","4","7","10","13","16","20"];
// Storm League: 2 alternating bans, 1-2-2 picks, 1 ban each, 2-2-1 picks
const ORDER = [
  {t:"F", k:"ban"}, {t:"S", k:"ban"}, {t:"F", k:"ban"}, {t:"S", k:"ban"},
  {t:"F", k:"pick"}, {t:"S", k:"pick"}, {t:"S", k:"pick"},
  {t:"F", k:"pick"}, {t:"F", k:"pick"},
  {t:"S", k:"ban"}, {t:"F", k:"ban"},
  {t:"S", k:"pick"}, {t:"S", k:"pick"},
  {t:"F", k:"pick"}, {t:"F", k:"pick"},
  {t:"S", k:"pick"},
];
const ROLE_CLS = { "Tank":"roleTank", "Healer":"roleHealer", "Bruiser":"roleBruiser", "Ranged Assassin":"roleRA", "Melee Assassin":"roleMA", "Support":"roleSupport" };

let state = { map: MAPS[3], first: "blue", mine: "blue", slots: [], activeIdx: null };

function roleOf(h) { return DATA.talents[h].expandedRole || DATA.talents[h].role; }
function nameOf(h) { return DATA.talents[h].name; }
function pfImg(h, cls) { return '<img class="pf" src="img/' + h + '.png" alt="" loading="lazy">'; }

function teams() {
  const F = state.first, S = F === "blue" ? "red" : "blue";
  return ORDER.map(o => ({ team: o.t === "F" ? F : S, kind: o.k }));
}
function initSlots() {
  state.slots = teams().map(t => ({ ...t, hero: null }));
  state.activeIdx = 0;
}
function nextEmpty() {
  const i = state.slots.findIndex(s => !s.hero);
  return i === -1 ? null : i;
}
function taken() { return new Set(state.slots.filter(s => s.hero).map(s => s.hero)); }
function teamHeroes(team, kind) { return state.slots.filter(s => s.team === team && s.kind === kind && s.hero).map(s => s.hero); }

function compNeeds(allies) {
  const roles = allies.map(roleOf);
  const tags = k => allies.reduce((a, h) => a + (DATA.meta[h].tags[k] || 0), 0);
  return {
    needTank: !roles.includes("Tank"),
    needHeal: !roles.includes("Healer"),
    needSolo: !roles.includes("Bruiser"),
    ranged: roles.filter(r => r === "Ranged Assassin").length,
    wc: tags("wc"), cc: tags("cc"),
    count: allies.length,
  };
}

function score(slug, allies, enemies) {
  const m = DATA.meta[slug];
  const role = roleOf(slug);
  let pts = TIER_SCORE[m.tier] ?? 1;
  const chips = [];
  if (m.tier === "S" || m.tier === "A") chips.push({ c: "neutral", t: m.tier + "-tier" });
  if (m.maps.includes(state.map)) { pts += 1.6; chips.push({ c: "map", t: "strong on this map" }); }
  const needs = compNeeds(allies);
  // core roles get more urgent the deeper the draft goes
  const urgency = 1.6 + 0.7 * needs.count;
  if (needs.needTank && role === "Tank") { pts += urgency; chips.push({ c: "good", t: "you need a tank" }); }
  if (needs.needHeal && role === "Healer") { pts += urgency; chips.push({ c: "good", t: "you need a healer" }); }
  if (needs.needSolo && role === "Bruiser" && needs.count >= 1) { pts += 1.6 + 0.4 * needs.count; chips.push({ c: "good", t: "you need a solo laner" }); }
  if (!needs.needTank && role === "Tank") pts -= 1.4;
  if (!needs.needHeal && role === "Healer") pts -= 1.4;
  if (needs.ranged >= 2 && role === "Ranged Assassin") { pts -= 2.2; chips.push({ c: "warn", t: "3rd ranged, comp gets soft" }); }
  if (needs.count >= 2 && needs.wc === 0 && (m.tags.wc || 0) > 0) { pts += 1.0; chips.push({ c: "good", t: "adds waveclear" }); }
  if (needs.count >= 3 && needs.cc === 0 && (m.tags.cc || 0) > 1) { pts += 0.8; chips.push({ c: "good", t: "adds lockdown" }); }
  for (const a of allies) {
    if ((m.syn || []).includes(a) || (DATA.meta[a].syn || []).includes(slug)) {
      pts += 1.2; chips.push({ c: "good", t: "synergy: " + nameOf(a) });
    }
  }
  for (const e of enemies) {
    if ((m.beats || []).includes(e)) { pts += 1.0; chips.push({ c: "good", t: "counters " + nameOf(e) }); }
    if ((DATA.meta[e].beats || []).includes(slug) || (m.loses || []).includes(e)) {
      pts -= 1.5; chips.push({ c: "warn", t: "countered by " + nameOf(e) });
    }
  }
  return { pts, chips };
}

function suggest() {
  const box = document.getElementById("suggList");
  const title = document.getElementById("suggTitle");
  const idx = state.activeIdx;
  if (idx === null) { title.textContent = "Draft complete"; box.innerHTML = '<p class="note">All slots filled. Click any hero on either team for their build and game plan.</p>'; return; }
  const slot = state.slots[idx];
  const isMine = slot.team === state.mine;
  const allies = teamHeroes(state.mine, "pick");
  const enemies = teamHeroes(state.mine === "blue" ? "red" : "blue", "pick");
  const tk = taken();
  const cands = Object.keys(DATA.meta).filter(h => !tk.has(h));
  if (slot.kind === "ban") {
    title.textContent = (isMine ? "Your ban" : "Their ban") + " · best targets vs " + (isMine ? "them" : "you");
    const scored = cands.map(h => {
      const m = DATA.meta[h];
      let pts = TIER_SCORE[m.tier] ?? 1;
      const chips = [];
      if (m.maps.includes(state.map)) { pts += 1.4; chips.push({ c: "map", t: "strong on this map" }); }
      for (const a of allies) if ((m.beats || []).includes(a)) { pts += 1.3; chips.push({ c: "warn", t: "hurts your " + nameOf(a) }); }
      if (m.tier === "S") chips.unshift({ c: "neutral", t: "S-tier, deny it" });
      return { h, pts, chips };
    }).sort((a, b) => b.pts - a.pts).slice(0, 5);
    render(scored, idx, "BAN");
    return;
  }
  title.textContent = isMine ? "Best picks for YOUR team" : "Likely enemy picks (their view)";
  const myAllies = isMine ? allies : enemies;
  const myEnemies = isMine ? enemies : allies;
  const scored = cands.map(h => ({ h, ...score(h, myAllies, myEnemies) }))
    .sort((a, b) => b.pts - a.pts).slice(0, 5);
  render(scored, idx, "PICK");
}

function render(scored, idx, verb) {
  const box = document.getElementById("suggList");
  box.innerHTML = "";
  scored.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "scard " + (ROLE_CLS[roleOf(s.h)] || "");
    d.innerHTML = '<div class="rank">' + (i + 1) + '</div>' + pfImg(s.h) +
      '<div class="hname">' + nameOf(s.h) + '<span class="hrole">' + roleOf(s.h) + '</span></div>' +
      '<div class="chips">' + s.chips.slice(0, 4).map(c => '<span class="chip ' + c.c + '">' + c.t + '</span>').join("") + '</div>';
    const b = document.createElement("button");
    b.className = "pickbtn"; b.textContent = verb;
    b.onclick = () => assign(idx, s.h);
    d.appendChild(b);
    box.appendChild(d);
  });
}

function assign(idx, hero) {
  state.slots[idx].hero = hero;
  if (state.slots[idx].kind === "pick" && state.slots[idx].team === state.mine) showBuild(hero);
  state.activeIdx = nextEmpty();
  closeModal(); draw();
}

function goalsFor(hero, allies, enemies) {
  const m = DATA.meta[hero], role = roleOf(hero);
  const g = [];
  if (role === "Bruiser") g.push(["early", "Hold the solo lane, soak every wave, don't die for a trade"]);
  else if (role === "Tank") g.push(["early", "Rotate with your ranged, punish anyone who steps too far up"]);
  else if (role === "Healer") g.push(["early", "Save your big cooldown for their engage, don't burn it on poke"]);
  else if (m.scale === "early") g.push(["early", "You are strongest NOW, force trades and camps before they scale"]);
  else if (m.scale === "late") g.push(["early", "Play safe and soak, you outscale everyone in this lobby"]);
  else g.push(["early", "Trade evenly, arrive at level 10 healthy and even in XP"]);
  if (m.tags.global) g.push(["mid", "Use your global to double-soak and show up to objectives late but free"]);
  else if (m.tags.camps) g.push(["mid", "Start camps right before objectives spawn so they push while you contest"]);
  else if ((m.tags.cc || 0) > 1) g.push(["mid", "Objectives are won by your setup, land it on their key hero"]);
  else g.push(["mid", "Group at 10, take the objective fight with ult advantage"]);
  if (m.scale === "late") g.push(["late", "You win late 5v5s, force them to fight around boss or objective"]);
  else g.push(["late", "Don't get caught alone, one death past 20 loses the game"]);
  const threats = enemies.filter(e => (DATA.meta[e].beats || []).includes(hero) || (m.loses || []).includes(e));
  const prey = enemies.filter(e => (m.beats || []).includes(e));
  if (threats.length) g.push(["fight", "Respect " + threats.map(nameOf).join(" and ") + ", they counter you"]);
  else if (prey.length) g.push(["fight", "Punish " + prey.map(nameOf).join(" and ") + " every time they show"]);
  return g;
}

function showBuild(hero) {
  const m = DATA.meta[hero], t = DATA.talents[hero];
  const bb = document.getElementById("buildBox");
  bb.style.display = "block";
  document.getElementById("buildPf").src = "img/" + hero + ".png";
  document.getElementById("buildTitle").textContent = t.name + " · " + roleOf(hero);
  document.getElementById("buildNote").textContent = m.note || "";
  const list = document.getElementById("buildList");
  list.innerHTML = "";
  m.build.forEach((name, i) => {
    const tier = TIERS[i];
    const tal = (t.talents[tier] || []).find(x => x.name === name);
    const row = document.createElement("div");
    row.className = "btier";
    row.innerHTML = '<span class="t">' + tier + '</span><span class="n">' + name + '</span>' +
      (tal ? '<span class="d">' + tal.description + '</span>' : "");
    list.appendChild(row);
  });
  const heroTeam = state.slots.find(s => s.hero === hero && s.kind === "pick");
  const team = heroTeam ? heroTeam.team : state.mine;
  const allies = teamHeroes(team, "pick").filter(h => h !== hero);
  const enemies = teamHeroes(team === "blue" ? "red" : "blue", "pick");
  const gl = document.getElementById("goalList");
  gl.innerHTML = "";
  goalsFor(hero, allies, enemies).forEach(([ph, txt]) => {
    const d = document.createElement("div");
    d.className = "goal";
    d.innerHTML = '<span class="ph ' + ph + '">' + (ph === "fight" ? "fights" : ph) + '</span><span>' + txt + '</span>';
    gl.appendChild(d);
  });
}

function draw() {
  for (const team of ["blue", "red"]) {
    const el = document.getElementById(team + "Slots");
    el.innerHTML = "";
    state.slots.forEach((s, i) => {
      if (s.team !== team) return;
      const d = document.createElement("div");
      d.className = "slot " + s.kind + (i === state.activeIdx ? " active" : "") + " " + (s.hero ? (ROLE_CLS[roleOf(s.hero)] || "") : "");
      d.innerHTML = '<span class="lbl">' + (s.kind === "ban" ? "BAN" : "PICK") + '</span>' +
        (s.hero ? pfImg(s.hero) : "") +
        '<span class="who ' + (s.hero ? "" : "empty") + '">' +
        (s.hero ? nameOf(s.hero) + '<span class="r">' + roleOf(s.hero) + '</span>' : "· · ·") + '</span>' +
        (s.hero ? '<span class="x" title="clear">✕</span>' : "");
      d.onclick = ev => {
        if (ev.target.classList.contains("x")) { s.hero = null; state.activeIdx = i; draw(); return; }
        if (s.hero) { if (s.kind === "pick") showBuild(s.hero); return; }
        state.activeIdx = i;
        draw(); openModal();
      };
      el.appendChild(d);
    });
  }
  const idx = state.activeIdx;
  document.getElementById("phase").textContent = idx === null ? "DRAFT COMPLETE" :
    "Now: " + state.slots[idx].team.toUpperCase() + " " + state.slots[idx].kind.toUpperCase() +
    (state.slots[idx].team === state.mine ? " (you)" : "");
  document.getElementById("mineBlue").className = "mine" + (state.mine === "blue" ? "" : " off");
  document.getElementById("mineRed").className = "mine" + (state.mine === "red" ? "" : " off");
  suggest();
}

function openModal() {
  const modal = document.getElementById("modal");
  modal.classList.add("open");
  const inp = document.getElementById("search");
  inp.value = ""; fillGrid(""); inp.focus();
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
function fillGrid(q) {
  const grid = document.getElementById("hgrid");
  grid.innerHTML = "";
  const tk = taken();
  Object.keys(DATA.talents).sort((a, b) => nameOf(a).localeCompare(nameOf(b))).forEach(h => {
    const nm = nameOf(h);
    if (q && !nm.toLowerCase().includes(q.toLowerCase())) return;
    const d = document.createElement("div");
    d.className = "hopt " + (ROLE_CLS[roleOf(h)] || "") + (tk.has(h) ? " taken" : "");
    d.innerHTML = pfImg(h) + nm + '<span class="r">' + roleOf(h) + '</span>';
    d.onclick = () => { if (state.activeIdx !== null) assign(state.activeIdx, h); };
    grid.appendChild(d);
  });
}

// wire up
const mapSel = document.getElementById("mapSel");
MAPS.forEach(m => { const o = document.createElement("option"); o.textContent = m; mapSel.appendChild(o); });
mapSel.value = state.map;
mapSel.onchange = () => { state.map = mapSel.value; draw(); };
document.getElementById("firstPick").onchange = e => { state.first = e.target.value; initSlots(); draw(); };
document.getElementById("mineBlue").onclick = () => { state.mine = "blue"; draw(); };
document.getElementById("mineRed").onclick = () => { state.mine = "red"; draw(); };
document.getElementById("resetBtn").onclick = () => { initSlots(); document.getElementById("buildBox").style.display = "none"; draw(); };
document.getElementById("search").oninput = e => fillGrid(e.target.value);
document.getElementById("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

initSlots(); draw();

// ponytail: #demo auto-plays 9 actions then stops, for screenshots of a mid-draft state
if (location.hash === "#demo") {
  for (let i = 0; i < 9 && state.activeIdx !== null; i++) {
    const top = document.querySelector("#suggList .scard .hname");
    const slug = Object.keys(DATA.talents).find(h => nameOf(h) === top.childNodes[0].textContent);
    assign(state.activeIdx, slug);
  }
}
// ponytail: headless smoke test — #selftest auto-drafts by always taking suggestion #1
if (location.hash === "#selftest") {
  try {
    const log = [];
    while (state.activeIdx !== null) {
      const idx = state.activeIdx, slot = state.slots[idx];
      const top = document.querySelector("#suggList .scard .hname");
      if (!top) throw new Error("no suggestion at slot " + idx);
      const name = top.childNodes[0].textContent;
      const slug = Object.keys(DATA.talents).find(h => nameOf(h) === name);
      log.push(slot.team + " " + slot.kind + ": " + name + " (" + roleOf(slug) + ")");
      assign(idx, slug);
    }
    if (state.slots.some(s => !s.hero)) throw new Error("unfilled slot");
    const all = state.slots.map(s => s.hero);
    if (new Set(all).size !== 16) throw new Error("duplicate hero");
    for (const team of ["blue", "red"]) {
      const roles = teamHeroes(team, "pick").map(roleOf);
      if (!roles.includes("Tank")) throw new Error(team + " has no tank");
      if (!roles.includes("Healer")) throw new Error(team + " has no healer");
      if (roles.filter(r => r === "Ranged Assassin").length > 2) throw new Error(team + " has 3+ ranged");
    }
    document.title = "SELFTEST OK";
    document.body.innerHTML = '<pre style="font-size:15px;color:#22c55e">SELFTEST OK\n' + log.join("\n") + '</pre>';
  } catch (e) { document.body.innerHTML = '<pre style="font-size:18px;color:#ef4444">SELFTEST FAIL: ' + e.message + '</pre>'; }
}
</script>
<script>
// styling-only: tint the phase pill by whichever team is on the clock (reads text, touches no app logic)
(function () {
  const el = document.getElementById("phase");
  if (!el) return;
  const sync = () => {
    const t = el.textContent || "";
    el.classList.toggle("p-blue", t.includes("BLUE"));
    el.classList.toggle("p-red", t.includes("RED"));
  };
  new MutationObserver(sync).observe(el, { childList: true, characterData: true, subtree: true });
  sync();
})();
</script>
