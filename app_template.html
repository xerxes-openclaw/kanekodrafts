<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanekodrafts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #0e1015; --panel: #161923; --panel2: #1d2130; --line: #2a2f42;
  --text: #e8eaf2; --dim: #8b91a7; --accent: #8b5cf6; --accent2: #a78bfa;
  --blue: #3b82f6; --red: #ef4444; --green: #22c55e; --amber: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; padding: 14px; }
h1 { font-size: 20px; letter-spacing: 0.06em; }
h1 span { color: var(--accent2); }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
select, button, input {
  background: var(--panel2); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font: inherit;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
.layout { display: grid; grid-template-columns: 250px 1fr 250px; gap: 12px; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr 1fr; } .mid { grid-column: 1 / -1; order: -1; } }
.teamcol { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.teamcol h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.blue h2 { color: var(--blue); } .red h2 { color: var(--red); }
.mine { font-size: 10px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 3px 7px; }
.mine.off { background: var(--panel2); color: var(--dim); border: 1px solid var(--line); }
.slot { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; min-height: 38px; cursor: pointer; }
.slot:hover { border-color: var(--accent); }
.slot.ban { opacity: 0.75; border-style: dashed; }
.slot.active { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.slot .lbl { font-size: 10px; color: var(--dim); width: 34px; flex: none; text-transform: uppercase; }
.slot .who { font-weight: 600; }
.slot .who.empty { color: var(--dim); font-weight: 400; }
.slot .x { margin-left: auto; color: var(--dim); font-size: 12px; padding: 0 4px; }
.mid { display: flex; flex-direction: column; gap: 12px; }
.sugg { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.sugg h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent2); margin-bottom: 10px; }
.scard { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.scard .rank { font-size: 18px; font-weight: 800; color: var(--accent2); width: 22px; flex: none; }
.scard .hname { font-weight: 700; font-size: 15px; width: 120px; flex: none; }
.scard .hrole { font-size: 10px; color: var(--dim); display: block; font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #232842; border: 1px solid var(--line); }
.chip.good { color: var(--green); border-color: #1d4d31; }
.chip.warn { color: var(--red); border-color: #5c2626; }
.chip.map { color: var(--amber); border-color: #5c4a1e; }
.chip.neutral { color: var(--dim); }
.scard .pickbtn { background: var(--accent); border: 0; color: #fff; font-weight: 600; border-radius: 8px; padding: 6px 12px; }
.buildbox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.buildbox h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--green); margin-bottom: 8px; }
.btier { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.btier:last-of-type { border-bottom: 0; }
.btier .t { font-size: 10px; color: var(--dim); width: 26px; flex: none; }
.btier .n { font-weight: 600; }
.btier .d { font-size: 11px; color: var(--dim); }
.bnote { margin-top: 8px; font-size: 12px; color: var(--amber); }
.modal { position: fixed; inset: 0; background: rgba(5,6,10,0.8); display: none; align-items: flex-start; justify-content: center; padding: 60px 16px; z-index: 10; }
.modal.open { display: flex; }
.mbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; width: min(680px, 100%); max-height: 75vh; overflow: auto; }
.mbox input { width: 100%; margin-bottom: 10px; font-size: 15px; }
.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.hopt { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; cursor: pointer; font-size: 13px; }
.hopt:hover { border-color: var(--accent); }
.hopt .r { display: block; font-size: 10px; color: var(--dim); }
.hopt.taken { opacity: 0.3; pointer-events: none; }
.note { color: var(--dim); font-size: 12px; }
.phase { font-size: 12px; color: var(--amber); font-weight: 600; }
</style>
</head>
<body>
<div class="top">
  <h1>⚔️ KANEKO<span>DRAFTS</span></h1>
  <select id="mapSel"></select>
  <select id="firstPick">
    <option value="blue">Blue picks first</option>
    <option value="red">Red picks first</option>
  </select>
  <button id="resetBtn">Reset draft</button>
  <span class="phase" id="phase"></span>
</div>

<div class="layout">
  <div class="teamcol blue">
    <h2>Blue team <button class="mine" id="mineBlue">MY TEAM</button></h2>
    <div id="blueSlots"></div>
  </div>
  <div class="mid">
    <div class="sugg">
      <h2 id="suggTitle">Suggestions</h2>
      <div id="suggList"><p class="note">Set the map, mark your team, then click any slot to start assigning. Suggestions update every pick.</p></div>
    </div>
    <div class="buildbox" id="buildBox" style="display:none">
      <h2 id="buildTitle">Build</h2>
      <div id="buildList"></div>
      <div class="bnote" id="buildNote"></div>
    </div>
  </div>
  <div class="teamcol red">
    <h2>Red team <button class="mine off" id="mineRed">MY TEAM</button></h2>
    <div id="redSlots"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <input id="search" placeholder="Search hero...">
    <div class="hgrid" id="hgrid"></div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/;
const MAPS = ["Alterac Pass","Battlefield of Eternity","Braxis Holdout","Cursed Hollow","Dragon Shire","Garden of Terror","Hanamura Temple","Infernal Shrines","Sky Temple","Tomb of the Spider Queen","Towers of Doom","Volskaya Foundry","Warhead Junction"];
const TIER_SCORE = { S: 3, A: 2, B: 1, C: 0 };
const TIERS = ["1","4","7","10","13","16","20"];
// Storm League draft order relative to first-pick team F and second team S
const ORDER = [
  {t:"F", k:"ban"}, {t:"S", k:"ban"}, {t:"F", k:"ban"}, {t:"S", k:"ban"},
  {t:"F", k:"pick"}, {t:"S", k:"pick"}, {t:"S", k:"pick"},
  {t:"F", k:"pick"}, {t:"F", k:"pick"},
  {t:"S", k:"ban"}, {t:"F", k:"ban"},
  {t:"S", k:"pick"}, {t:"S", k:"pick"},
  {t:"F", k:"pick"}, {t:"F", k:"pick"},
  {t:"S", k:"pick"},
];

let state = { map: MAPS[3], first: "blue", mine: "blue", slots: [], activeIdx: null, locked: null };

function teams() {
  const F = state.first, S = F === "blue" ? "red" : "blue";
  return ORDER.map(o => ({ team: o.t === "F" ? F : S, kind: o.k }));
}
function initSlots() {
  state.slots = teams().map(t => ({ ...t, hero: null }));
  state.activeIdx = nextEmpty();
  state.locked = null;
}
function nextEmpty() {
  const i = state.slots.findIndex(s => !s.hero);
  return i === -1 ? null : i;
}
function taken() { return new Set(state.slots.filter(s => s.hero).map(s => s.hero)); }
function teamHeroes(team, kind) { return state.slots.filter(s => s.team === team && s.kind === kind && s.hero).map(s => s.hero); }

function compNeeds(allies) {
  const roles = allies.map(h => DATA.talents[h].expandedRole || DATA.talents[h].role);
  const tags = k => allies.reduce((a, h) => a + (DATA.meta[h].tags[k] || 0), 0);
  return {
    needTank: !roles.includes("Tank"),
    needHeal: !roles.includes("Healer"),
    wc: tags("wc"), cc: tags("cc"), peel: tags("peel"),
    count: allies.length,
  };
}

function score(slug, allies, enemies) {
  const m = DATA.meta[slug];
  const role = DATA.talents[slug].expandedRole || DATA.talents[slug].role;
  let pts = TIER_SCORE[m.tier] ?? 1;
  const chips = [];
  if (m.tier === "S" || m.tier === "A") chips.push({ c: "neutral", t: m.tier + "-tier" });
  if (m.maps.includes(state.map)) { pts += 1.6; chips.push({ c: "map", t: "strong on this map" }); }
  const needs = compNeeds(allies);
  if (needs.needTank && role === "Tank") { pts += 2.6; chips.push({ c: "good", t: "you need a tank" }); }
  if (needs.needHeal && role === "Healer") { pts += 2.6; chips.push({ c: "good", t: "you need a healer" }); }
  if (!needs.needTank && role === "Tank") pts -= 1.2;
  if (!needs.needHeal && role === "Healer") pts -= 1.2;
  if (needs.count >= 2 && needs.wc === 0 && (m.tags.wc || 0) > 0) { pts += 1.0; chips.push({ c: "good", t: "adds waveclear" }); }
  if (needs.count >= 3 && needs.cc === 0 && (m.tags.cc || 0) > 1) { pts += 0.8; chips.push({ c: "good", t: "adds lockdown" }); }
  for (const a of allies) {
    if ((m.syn || []).includes(a) || (DATA.meta[a].syn || []).includes(slug)) {
      pts += 1.2; chips.push({ c: "good", t: "synergy: " + DATA.talents[a].name });
    }
  }
  for (const e of enemies) {
    if ((m.beats || []).includes(e)) { pts += 1.0; chips.push({ c: "good", t: "counters " + DATA.talents[e].name }); }
    if ((DATA.meta[e].beats || []).includes(slug) || (m.loses || []).includes(e)) {
      pts -= 1.5; chips.push({ c: "warn", t: "countered by " + DATA.talents[e].name });
    }
  }
  return { pts, chips };
}

function suggest() {
  const box = document.getElementById("suggList");
  const title = document.getElementById("suggTitle");
  const idx = state.activeIdx;
  if (idx === null) { title.textContent = "Draft complete"; box.innerHTML = '<p class="note">All slots filled. Tap any locked pick to see its build.</p>'; return; }
  const slot = state.slots[idx];
  const isMine = slot.team === state.mine;
  const allies = teamHeroes(state.mine, "pick");
  const enemies = teamHeroes(state.mine === "blue" ? "red" : "blue", "pick");
  const tk = taken();
  if (slot.kind === "ban") {
    title.textContent = (isMine ? "Your ban" : "Their ban") + " · best targets vs " + (isMine ? "them" : "you");
    // ban suggestions: strongest heroes that hurt MY comp / are S tier
    const cands = Object.keys(DATA.meta).filter(h => !tk.has(h));
    const scored = cands.map(h => {
      const m = DATA.meta[h];
      let pts = TIER_SCORE[m.tier] ?? 1;
      const chips = [];
      if (m.maps.includes(state.map)) { pts += 1.4; chips.push({ c: "map", t: "strong on this map" }); }
      for (const a of allies) if ((m.beats || []).includes(a)) { pts += 1.3; chips.push({ c: "warn", t: "hurts your " + DATA.talents[a].name }); }
      if (m.tier === "S") chips.unshift({ c: "neutral", t: "S-tier, deny it" });
      return { h, pts, chips };
    }).sort((a, b) => b.pts - a.pts).slice(0, 5);
    render(scored, idx, "BAN");
    return;
  }
  title.textContent = isMine ? "Best picks for YOUR team" : "Likely enemy picks (their view)";
  const myAllies = isMine ? allies : enemies;
  const myEnemies = isMine ? enemies : allies;
  const cands = Object.keys(DATA.meta).filter(h => !tk.has(h));
  const scored = cands.map(h => ({ h, ...score(h, myAllies, myEnemies) }))
    .sort((a, b) => b.pts - a.pts).slice(0, 5);
  render(scored, idx, "PICK");
}

function render(scored, idx, verb) {
  const box = document.getElementById("suggList");
  box.innerHTML = "";
  scored.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "scard";
    const role = DATA.talents[s.h].expandedRole || DATA.talents[s.h].role;
    d.innerHTML = '<div class="rank">' + (i + 1) + '</div>' +
      '<div class="hname">' + DATA.talents[s.h].name + '<span class="hrole">' + role + '</span></div>' +
      '<div class="chips">' + s.chips.slice(0, 4).map(c => '<span class="chip ' + c.c + '">' + c.t + '</span>').join("") + '</div>';
    const b = document.createElement("button");
    b.className = "pickbtn"; b.textContent = verb;
    b.onclick = () => assign(idx, s.h);
    d.appendChild(b);
    box.appendChild(d);
  });
}

function assign(idx, hero) {
  state.slots[idx].hero = hero;
  if (state.slots[idx].kind === "pick" && state.slots[idx].team === state.mine) showBuild(hero);
  state.activeIdx = nextEmpty();
  closeModal(); draw();
}

function showBuild(hero) {
  const m = DATA.meta[hero], t = DATA.talents[hero];
  const bb = document.getElementById("buildBox");
  bb.style.display = "block";
  document.getElementById("buildTitle").textContent = "Build · " + t.name;
  const list = document.getElementById("buildList");
  list.innerHTML = "";
  m.build.forEach((name, i) => {
    const tier = TIERS[i];
    const tal = (t.talents[tier] || []).find(x => x.name === name);
    const row = document.createElement("div");
    row.className = "btier";
    row.innerHTML = '<span class="t">' + tier + '</span><span class="n">' + name + '</span>' +
      (tal ? '<span class="d">' + tal.description + '</span>' : "");
    list.appendChild(row);
  });
  document.getElementById("buildNote").textContent = m.note || "";
  state.locked = hero;
}

function draw() {
  for (const team of ["blue", "red"]) {
    const el = document.getElementById(team + "Slots");
    el.innerHTML = "";
    state.slots.forEach((s, i) => {
      if (s.team !== team) return;
      const d = document.createElement("div");
      d.className = "slot " + s.kind + (i === state.activeIdx ? " active" : "");
      d.innerHTML = '<span class="lbl">' + (s.kind === "ban" ? "BAN" : "PICK") + '</span>' +
        '<span class="who ' + (s.hero ? "" : "empty") + '">' + (s.hero ? DATA.talents[s.hero].name : "· · ·") + '</span>' +
        (s.hero ? '<span class="x" title="clear">✕</span>' : "");
      d.onclick = ev => {
        if (ev.target.classList.contains("x")) { s.hero = null; state.activeIdx = i; draw(); return; }
        state.activeIdx = i;
        if (s.hero && s.kind === "pick") showBuild(s.hero);
        draw(); openModal();
      };
      el.appendChild(d);
    });
  }
  const idx = state.activeIdx;
  document.getElementById("phase").textContent = idx === null ? "DRAFT COMPLETE" :
    "Now: " + state.slots[idx].team.toUpperCase() + " " + state.slots[idx].kind.toUpperCase() +
    (state.slots[idx].team === state.mine ? " (you)" : "");
  document.getElementById("mineBlue").className = "mine" + (state.mine === "blue" ? "" : " off");
  document.getElementById("mineRed").className = "mine" + (state.mine === "red" ? "" : " off");
  suggest();
}

function openModal() {
  const modal = document.getElementById("modal");
  modal.classList.add("open");
  const inp = document.getElementById("search");
  inp.value = ""; fillGrid(""); inp.focus();
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
function fillGrid(q) {
  const grid = document.getElementById("hgrid");
  grid.innerHTML = "";
  const tk = taken();
  Object.keys(DATA.talents).sort((a, b) => DATA.talents[a].name.localeCompare(DATA.talents[b].name)).forEach(h => {
    const nm = DATA.talents[h].name;
    if (q && !nm.toLowerCase().includes(q.toLowerCase())) return;
    const d = document.createElement("div");
    d.className = "hopt" + (tk.has(h) ? " taken" : "");
    d.innerHTML = nm + '<span class="r">' + (DATA.talents[h].expandedRole || DATA.talents[h].role) + " · " + DATA.meta[h].tier + '</span>';
    d.onclick = () => { if (state.activeIdx !== null) assign(state.activeIdx, h); };
    grid.appendChild(d);
  });
}

// wire up
const mapSel = document.getElementById("mapSel");
MAPS.forEach(m => { const o = document.createElement("option"); o.textContent = m; mapSel.appendChild(o); });
mapSel.value = state.map;
mapSel.onchange = () => { state.map = mapSel.value; draw(); };
document.getElementById("firstPick").onchange = e => { state.first = e.target.value; initSlots(); draw(); };
document.getElementById("mineBlue").onclick = () => { state.mine = "blue"; draw(); };
document.getElementById("mineRed").onclick = () => { state.mine = "red"; draw(); };
document.getElementById("resetBtn").onclick = () => { initSlots(); document.getElementById("buildBox").style.display = "none"; draw(); };
document.getElementById("search").oninput = e => fillGrid(e.target.value);
document.getElementById("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

initSlots(); draw();

// ponytail: headless smoke test — #selftest auto-drafts by always taking suggestion #1
if (location.hash === "#selftest") {
  try {
    const log = [];
    while (state.activeIdx !== null) {
      const idx = state.activeIdx, slot = state.slots[idx];
      const top = document.querySelector("#suggList .scard .hname");
      if (!top) throw new Error("no suggestion at slot " + idx);
      const name = top.childNodes[0].textContent;
      const slug = Object.keys(DATA.talents).find(h => DATA.talents[h].name === name);
      log.push(slot.team + " " + slot.kind + ": " + name);
      assign(idx, slug);
    }
    if (state.slots.some(s => !s.hero)) throw new Error("unfilled slot");
    const picks = state.slots.filter(s => s.kind === "pick").map(s => s.hero);
    if (new Set(picks.concat(state.slots.filter(s=>s.kind==="ban").map(s=>s.hero))).size !== 16) throw new Error("duplicate hero");
    document.title = "SELFTEST OK";
    document.body.innerHTML = '<pre style="font-size:15px;color:#22c55e">SELFTEST OK\n' + log.join("\n") + '</pre>';
  } catch (e) { document.body.innerHTML = '<pre style="font-size:18px;color:#ef4444">SELFTEST FAIL: ' + e.message + '</pre>'; }
}
</script>
</body>
</html>
