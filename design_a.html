<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanekodrafts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* ============ NEXUS CLASSIC ============ */
:root {
  --gold: #d9b24f; --gold-hi: #f5df9a; --gold-dk: #8a6d2f; --gold-line: #6b552a;
  --text: #ece7d9; --dim: #9a94b8;
  --blue: #5b9bff; --red: #ff5f5f; --green: #4fd98a; --amber: #f2b04a; --violet: #b28dff;
  --panel-hi: rgba(30, 30, 64, 0.94); --panel-lo: rgba(12, 13, 30, 0.96);
  --card: rgba(22, 23, 52, 0.85); --card-line: #3a3466;
  --serif: "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --hex: polygon(50% 1%, 94% 26%, 94% 74%, 50% 99%, 6% 74%, 6% 26%);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { min-height: 100%; }
body {
  color: var(--text);
  font: 14px/1.45 "Segoe UI", -apple-system, Roboto, sans-serif;
  padding: 18px 16px;
  min-height: 100vh;
  background:
    radial-gradient(ellipse 70% 45% at 50% -5%, rgba(112, 70, 210, 0.38), transparent 70%),
    radial-gradient(ellipse 55% 60% at 88% 100%, rgba(40, 70, 190, 0.30), transparent 65%),
    radial-gradient(ellipse 45% 45% at 8% 85%, rgba(90, 40, 160, 0.22), transparent 65%),
    linear-gradient(180deg, #0b0c26 0%, #0a0a20 45%, #070816 100%);
  background-attachment: fixed;
}
/* faint starfield: three repeating dot layers */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(circle at 22px 34px, rgba(255,255,255,0.55) 0 1px, transparent 1.6px),
    radial-gradient(circle at 121px 90px, rgba(255,255,255,0.35) 0 1px, transparent 1.6px),
    radial-gradient(circle at 180px 160px, rgba(200,210,255,0.45) 0 1px, transparent 1.6px),
    radial-gradient(circle at 65px 140px, rgba(255,240,200,0.30) 0 1px, transparent 1.6px),
    radial-gradient(circle at 160px 40px, rgba(255,255,255,0.22) 0 1.4px, transparent 2px);
  background-size: 210px 210px, 260px 260px, 230px 230px, 190px 190px, 320px 320px;
}
body { display: flex; flex-direction: column; }
body > * { position: relative; z-index: 1; }
.shell { margin: auto 0; width: 100%; }

/* ---------- top command bar ---------- */
.top {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-bottom: 16px; padding: 10px 16px 12px;
  background: linear-gradient(180deg, rgba(28,26,60,0.92), rgba(12,12,30,0.92));
  border: 1px solid var(--gold-line); border-radius: 3px; position: relative;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.65), 0 6px 22px rgba(0,0,0,0.55), inset 0 1px 0 rgba(245,223,154,0.10);
}
.top::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(var(--gold-hi), var(--gold-hi)) top left / 18px 2px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) top left / 2px 18px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) top right / 18px 2px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) top right / 2px 18px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) bottom left / 18px 2px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) bottom left / 2px 18px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) bottom right / 18px 2px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) bottom right / 2px 18px;
  background-repeat: no-repeat; opacity: 0.85;
}
h1 {
  font-family: var(--serif); font-size: 24px; letter-spacing: 0.14em; font-weight: 700;
  color: var(--gold-hi);
  text-shadow: 0 0 18px rgba(217,178,79,0.55), 0 2px 3px rgba(0,0,0,0.9);
}
h1 span { color: var(--violet); text-shadow: 0 0 18px rgba(178,141,255,0.6), 0 2px 3px rgba(0,0,0,0.9); }

select, button, input {
  background: linear-gradient(180deg, #262a56, #14163a);
  color: var(--text); border: 1px solid var(--gold-dk);
  border-radius: 3px; padding: 7px 12px; font: inherit;
  box-shadow: inset 0 1px 0 rgba(245,223,154,0.14), inset 0 -3px 6px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.6);
}
select { color: var(--gold-hi); }
button {
  cursor: pointer; color: var(--gold-hi); text-transform: uppercase;
  letter-spacing: 0.08em; font-size: 12px; font-weight: 600;
}
button:hover, select:hover {
  border-color: var(--gold-hi);
  box-shadow: inset 0 1px 0 rgba(245,223,154,0.2), inset 0 -3px 6px rgba(0,0,0,0.45), 0 0 10px rgba(217,178,79,0.35);
}
.phasewrap { text-align: center; margin-bottom: 14px; }
.phase {
  display: inline-flex; align-items: center; gap: 11px;
  font-family: var(--serif); font-size: 19px; color: #ffd77e; font-weight: 800;
  letter-spacing: 0.18em; text-transform: uppercase; padding: 9px 32px;
  border: 1px solid rgba(255,200,90,0.55); border-radius: 3px;
  background: linear-gradient(180deg, rgba(74,54,16,0.55), rgba(28,20,8,0.7));
  text-shadow: 0 0 12px rgba(255,200,90,.6), 0 2px 3px rgba(0,0,0,0.9);
  box-shadow: 0 0 20px rgba(217,178,79,0.28), inset 0 1px 0 rgba(245,223,154,0.16);
}
.phase::before {
  content: ""; width: 9px; height: 9px; border-radius: 50%; flex: none;
  background: #ffcf5e; box-shadow: 0 0 9px rgba(255,200,90,0.95);
  animation: phasepulse 1.2s ease-in-out infinite;
}
@keyframes phasepulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
.phase:empty { display: none; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 280px 1fr 280px; gap: 14px; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr 1fr; } .mid { grid-column: 1 / -1; order: -1; } }

/* ---------- ornate panels ---------- */
.teamcol, .sugg, .buildbox, .mbox {
  position: relative;
  background: linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
  border: 1px solid var(--gold-line); border-radius: 3px;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.65), 0 10px 28px rgba(0,0,0,0.55),
    inset 0 0 60px rgba(24,18,70,0.45), inset 0 1px 0 rgba(245,223,154,0.08);
}
.teamcol::before, .sugg::before, .buildbox::before, .mbox::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background:
    linear-gradient(var(--gold-hi), var(--gold-hi)) top left / 20px 2px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) top left / 2px 20px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) top right / 20px 2px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) top right / 2px 20px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) bottom left / 20px 2px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) bottom left / 2px 20px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) bottom right / 20px 2px,
    linear-gradient(var(--gold-hi), var(--gold-hi)) bottom right / 2px 20px;
  background-repeat: no-repeat; opacity: 0.8;
}
.teamcol { padding: 12px; height: fit-content; }
.teamcol.blue { box-shadow: 0 0 0 1px rgba(0,0,0,0.65), 0 10px 28px rgba(0,0,0,0.55),
  inset 0 0 60px rgba(24,18,70,0.45), inset 0 40px 70px -50px rgba(64,120,255,0.55), inset 0 1px 0 rgba(245,223,154,0.08); }
.teamcol.red { box-shadow: 0 0 0 1px rgba(0,0,0,0.65), 0 10px 28px rgba(0,0,0,0.55),
  inset 0 0 60px rgba(24,18,70,0.45), inset 0 40px 70px -50px rgba(255,80,80,0.5), inset 0 1px 0 rgba(245,223,154,0.08); }
.teamcol h2 {
  font-family: var(--serif); font-size: 14px; text-transform: uppercase; letter-spacing: 0.14em;
  margin-bottom: 10px; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(217,178,79,0.28);
}
.blue h2 { color: var(--blue); text-shadow: 0 0 14px rgba(91,155,255,0.6); }
.red h2 { color: var(--red); text-shadow: 0 0 14px rgba(255,95,95,0.6); }
.mine {
  font-size: 10px; letter-spacing: 0.1em;
  background: linear-gradient(180deg, #f0d078, #b8862e);
  color: #2a1c05; border: 1px solid var(--gold-hi); border-radius: 3px; padding: 3px 8px;
  box-shadow: inset 0 1px 0 rgba(255,248,220,0.6), 0 0 10px rgba(217,178,79,0.4);
  text-shadow: none; font-weight: 800;
}
.mine.off {
  background: linear-gradient(180deg, #262a56, #14163a);
  color: var(--dim); border: 1px solid #3a3466; box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4);
}

/* ---------- draft slots ---------- */
.slot {
  display: flex; align-items: center; gap: 9px; position: relative;
  background: linear-gradient(180deg, rgba(30,30,62,0.7), rgba(14,14,34,0.85));
  border: 1px solid var(--card-line); border-radius: 3px;
  padding: 5px 8px; margin-bottom: 7px; min-height: 56px; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
.slot .pf { width: 44px; height: 48px; }
.slot:hover { border-color: var(--gold); box-shadow: 0 0 8px rgba(217,178,79,0.25), inset 0 1px 0 rgba(255,255,255,0.05); }
.slot.ban { border-style: dashed; border-color: #5a3050; background: linear-gradient(180deg, rgba(40,20,38,0.5), rgba(16,10,22,0.8)); }
.slot.ban img { filter: grayscale(1) brightness(1.45); }
.slot.ban:has(img)::after {
  content: ""; position: absolute; left: 59px; top: 50%; width: 44px; height: 48px;
  transform: translateY(-50%); clip-path: var(--hex); pointer-events: none;
  background: linear-gradient(45deg, transparent 43%, rgba(255,70,70,0.9) 46%, rgba(255,70,70,0.9) 54%, transparent 57%);
}
.slot.active {
  border-color: var(--gold-hi);
  box-shadow: 0 0 14px rgba(240,208,120,0.5), inset 0 0 12px rgba(240,208,120,0.15);
  background: linear-gradient(180deg, rgba(58,48,26,0.5), rgba(24,20,12,0.8));
}
.slot .lbl {
  font-family: var(--serif); font-size: 10px; color: var(--gold); width: 42px; flex: none;
  text-transform: uppercase; letter-spacing: 0.1em; line-height: 1.25;
}
.slot.ban .lbl { color: #b06a8a; }
#blueSlots, #redSlots { counter-reset: banC pickC; }
.slot.ban { counter-increment: banC; }
.slot.pick { counter-increment: pickC; }
.slot.ban .lbl::after { content: " " counter(banC); }
.slot.pick .lbl::after { content: " " counter(pickC); }

/* ---------- hex portraits ---------- */
.pf {
  width: 40px; height: 44px; flex: none; object-fit: cover;
  border: 0; border-radius: 0;
  clip-path: var(--hex);
  background: #05060f;
  filter: drop-shadow(0 0 1px var(--ring, var(--gold))) drop-shadow(0 0 1px var(--ring, var(--gold))) drop-shadow(0 0 4px var(--ring, var(--gold)));
}
.roleTank .pf { --ring: #8fb2f5; } .roleHealer .pf { --ring: #62e09a; }
.roleBruiser .pf { --ring: #f0b464; } .roleRA .pf { --ring: #ea8cc6; }
.roleMA .pf { --ring: #f07878; } .roleSupport .pf { --ring: #ab9af5; }

.slot .who { font-weight: 600; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
.slot .who .r { display: block; font-size: 10px; color: var(--dim); font-weight: 400; letter-spacing: 0.04em; }
.slot .who.empty {
  display: flex; align-items: center; font-size: 0; letter-spacing: 0; font-weight: 400;
}
.slot .who.empty::before {
  content: ""; width: 44px; height: 48px; flex: none; clip-path: var(--hex);
  background: linear-gradient(180deg, rgba(170,164,210,0.9), rgba(95,90,150,0.55));
  opacity: 0.3;
}
.slot .x { margin-left: auto; color: var(--dim); font-size: 12px; padding: 0 4px; }
.slot .x:hover { color: var(--red); }

/* ---------- middle column ---------- */
.mid { display: flex; flex-direction: column; gap: 14px; }
.sugg { padding: 14px; }
.sugg h2, .bhead h2, .goals h3 {
  font-family: var(--serif); text-transform: uppercase;
  color: var(--gold-hi);
  text-shadow: 0 0 14px rgba(217,178,79,0.5), 0 2px 3px rgba(0,0,0,0.9);
}
.sugg h2 { font-size: 15px; letter-spacing: 0.14em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(217,178,79,0.28); }
.scard {
  background: var(--card);
  border: 1px solid var(--card-line); border-radius: 3px;
  padding: 9px 12px; margin-bottom: 9px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 6px rgba(0,0,0,0.35);
}
.scard:hover { border-color: rgba(217,178,79,0.55); }
.scard .rank {
  font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--gold);
  width: 22px; flex: none; text-align: center;
  text-shadow: 0 0 10px rgba(217,178,79,0.5), 0 2px 2px rgba(0,0,0,0.8);
}
.scard .pf { width: 48px; height: 53px; }
.scard .hname { font-weight: 700; font-size: 15px; width: 112px; flex: none; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
.scard .hrole { font-size: 10px; color: var(--dim); display: block; font-weight: 400; letter-spacing: 0.04em; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
.chip {
  font-size: 12px; padding: 4px 10px; border-radius: 2px;
  background: rgba(120,120,190,0.12); border: 1px solid #4a4580; color: #d8d3ef;
}
.chip.good { color: #7ce8a8; border-color: rgba(110,240,160,0.55); background: rgba(80,255,150,0.10); }
.chip.warn { color: #ff8a8a; border-color: rgba(255,110,110,0.6); background: rgba(255,80,80,0.15); }
.chip.map { color: #ffd77e; border-color: rgba(255,200,90,0.6); background: rgba(255,200,90,0.12); }
.chip.neutral { color: #c9c3e6; }
.scard .pickbtn {
  background: linear-gradient(180deg, #f0d078, #c1913a 55%, #a5762a);
  border: 1px solid var(--gold-hi); color: #2a1c05; font-weight: 800; letter-spacing: 0.12em;
  border-radius: 3px; padding: 7px 14px;
  box-shadow: inset 0 1px 0 rgba(255,248,220,0.7), inset 0 -3px 5px rgba(90,60,10,0.5), 0 0 10px rgba(217,178,79,0.3);
  text-shadow: 0 1px 0 rgba(255,240,200,0.4);
}
.scard .pickbtn:hover { filter: brightness(1.12); box-shadow: inset 0 1px 0 rgba(255,248,220,0.7), 0 0 16px rgba(240,208,120,0.55); }

/* ---------- build box ---------- */
.buildbox { padding: 14px; }
.bhead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(217,178,79,0.28); }
.bhead .pf { width: 48px; height: 53px; --ring: var(--green); }
.bhead h2 { font-size: 15px; letter-spacing: 0.1em; }
.bhead .note { font-size: 12px; color: var(--amber); }
.btier { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid rgba(217,178,79,0.14); }
.btier .t {
  font-family: var(--serif); font-size: 11px; color: var(--gold); width: 26px; flex: none;
  text-align: center; font-weight: 700;
}
.btier .n { font-weight: 600; }
.btier .d { font-size: 11px; color: var(--dim); }
.goals { margin-top: 12px; }
.goals h3 { font-size: 12px; letter-spacing: 0.16em; margin-bottom: 7px; }
.goal { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
.goal .ph { font-family: var(--serif); font-size: 10px; font-weight: 700; width: 52px; flex: none; text-transform: uppercase; letter-spacing: 0.06em; }
.goal .ph.early { color: var(--green); } .goal .ph.mid { color: var(--amber); }
.goal .ph.late { color: var(--violet); } .goal .ph.fight { color: var(--red); }

/* ---------- modal ---------- */
.modal {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 30%, rgba(50,30,110,0.45), transparent 70%), rgba(4,5,14,0.88);
  display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 10;
}
.modal.open { display: flex; }
.mbox { padding: 16px; width: min(880px, 100%); max-height: 82vh; overflow: auto; }
.mbox input { width: 100%; margin-bottom: 12px; font-size: 15px; color: var(--gold-hi); }
.mbox input::placeholder { color: #6b6592; }
.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 9px; }
.hopt {
  background: linear-gradient(180deg, rgba(30,30,62,0.7), rgba(14,14,34,0.85));
  border: 1px solid var(--card-line); border-radius: 3px;
  padding: 9px 4px 7px; cursor: pointer; font-size: 11px; text-align: center;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.hopt:hover { border-color: var(--gold-hi); box-shadow: 0 0 12px rgba(240,208,120,0.35); }
.hopt .pf { width: 52px; height: 57px; margin: 0 auto 5px; display: block; }
.hopt .r { display: block; font-size: 9px; color: var(--dim); }
.hopt.taken { opacity: 0.22; pointer-events: none; filter: grayscale(1); }

.note { color: var(--dim); font-size: 12px; }

/* scrollbar to match */
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #0c0d22; }
::-webkit-scrollbar-thumb { background: #3a3466; border: 2px solid #0c0d22; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold-dk); }
</style>
</head>
<body>
<div class="shell">
<div class="top">
  <h1>⚔️ KANEKO<span>DRAFTS</span></h1>
  <select id="mapSel"></select>
  <select id="firstPick">
    <option value="blue">Blue picks first</option>
    <option value="red">Red picks first</option>
  </select>
  <button id="resetBtn">Reset draft</button>
</div>

<div class="phasewrap"><span class="phase" id="phase"></span></div>

<div class="layout">
  <div class="teamcol blue">
    <h2>Blue team <button class="mine" id="mineBlue">MY TEAM</button></h2>
    <div id="blueSlots"></div>
  </div>
  <div class="mid">
    <div class="sugg">
      <h2 id="suggTitle">Suggestions</h2>
      <div id="suggList"><p class="note">Set the map, mark your team, then click any slot to start assigning. Suggestions update every pick.</p></div>
    </div>
    <div class="buildbox" id="buildBox" style="display:none">
      <div class="bhead"><img class="pf" id="buildPf" alt=""><div><h2 id="buildTitle">Build</h2><span class="note" id="buildNote"></span></div></div>
      <div id="buildList"></div>
      <div class="goals"><h3>Game plan</h3><div id="goalList"></div></div>
    </div>
  </div>
  <div class="teamcol red">
    <h2>Red team <button class="mine off" id="mineRed">MY TEAM</button></h2>
    <div id="redSlots"></div>
  </div>
</div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <input id="search" placeholder="Search hero...">
    <div class="hgrid" id="hgrid"></div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/;
const MAPS = ["Alterac Pass","Battlefield of Eternity","Braxis Holdout","Cursed Hollow","Dragon Shire","Garden of Terror","Hanamura Temple","Haunted Mines","Infernal Shrines","Sky Temple","Tomb of the Spider Queen","Towers of Doom","Volskaya Foundry","Warhead Junction"];
const TIER_SCORE = { S: 3, A: 2, B: 1, C: 0 };
const TIERS = ["1","4","7","10","13","16","20"];
// Storm League: 2 alternating bans, 1-2-2 picks, 1 ban each, 2-2-1 picks
const ORDER = [
  {t:"F", k:"ban"}, {t:"S", k:"ban"}, {t:"F", k:"ban"}, {t:"S", k:"ban"},
  {t:"F", k:"pick"}, {t:"S", k:"pick"}, {t:"S", k:"pick"},
  {t:"F", k:"pick"}, {t:"F", k:"pick"},
  {t:"S", k:"ban"}, {t:"F", k:"ban"},
  {t:"S", k:"pick"}, {t:"S", k:"pick"},
  {t:"F", k:"pick"}, {t:"F", k:"pick"},
  {t:"S", k:"pick"},
];
const ROLE_CLS = { "Tank":"roleTank", "Healer":"roleHealer", "Bruiser":"roleBruiser", "Ranged Assassin":"roleRA", "Melee Assassin":"roleMA", "Support":"roleSupport" };

let state = { map: MAPS[3], first: "blue", mine: "blue", slots: [], activeIdx: null };

function roleOf(h) { return DATA.talents[h].expandedRole || DATA.talents[h].role; }
function nameOf(h) { return DATA.talents[h].name; }
function pfImg(h, cls) { return '<img class="pf" src="img/' + h + '.png" alt="" loading="lazy">'; }

function teams() {
  const F = state.first, S = F === "blue" ? "red" : "blue";
  return ORDER.map(o => ({ team: o.t === "F" ? F : S, kind: o.k }));
}
function initSlots() {
  state.slots = teams().map(t => ({ ...t, hero: null }));
  state.activeIdx = 0;
}
function nextEmpty() {
  const i = state.slots.findIndex(s => !s.hero);
  return i === -1 ? null : i;
}
function taken() { return new Set(state.slots.filter(s => s.hero).map(s => s.hero)); }
function teamHeroes(team, kind) { return state.slots.filter(s => s.team === team && s.kind === kind && s.hero).map(s => s.hero); }

function compNeeds(allies) {
  const roles = allies.map(roleOf);
  const tags = k => allies.reduce((a, h) => a + (DATA.meta[h].tags[k] || 0), 0);
  return {
    needTank: !roles.includes("Tank"),
    needHeal: !roles.includes("Healer"),
    needSolo: !roles.includes("Bruiser"),
    ranged: roles.filter(r => r === "Ranged Assassin").length,
    wc: tags("wc"), cc: tags("cc"),
    count: allies.length,
  };
}

function score(slug, allies, enemies) {
  const m = DATA.meta[slug];
  const role = roleOf(slug);
  let pts = TIER_SCORE[m.tier] ?? 1;
  const chips = [];
  if (m.tier === "S" || m.tier === "A") chips.push({ c: "neutral", t: m.tier + "-tier" });
  if (m.maps.includes(state.map)) { pts += 1.6; chips.push({ c: "map", t: "strong on this map" }); }
  const needs = compNeeds(allies);
  // core roles get more urgent the deeper the draft goes
  const urgency = 1.6 + 0.7 * needs.count;
  if (needs.needTank && role === "Tank") { pts += urgency; chips.push({ c: "good", t: "you need a tank" }); }
  if (needs.needHeal && role === "Healer") { pts += urgency; chips.push({ c: "good", t: "you need a healer" }); }
  if (needs.needSolo && role === "Bruiser" && needs.count >= 1) { pts += 1.6 + 0.4 * needs.count; chips.push({ c: "good", t: "you need a solo laner" }); }
  if (!needs.needTank && role === "Tank") pts -= 1.4;
  if (!needs.needHeal && role === "Healer") pts -= 1.4;
  if (needs.ranged >= 2 && role === "Ranged Assassin") { pts -= 2.2; chips.push({ c: "warn", t: "3rd ranged, comp gets soft" }); }
  if (needs.count >= 2 && needs.wc === 0 && (m.tags.wc || 0) > 0) { pts += 1.0; chips.push({ c: "good", t: "adds waveclear" }); }
  if (needs.count >= 3 && needs.cc === 0 && (m.tags.cc || 0) > 1) { pts += 0.8; chips.push({ c: "good", t: "adds lockdown" }); }
  for (const a of allies) {
    if ((m.syn || []).includes(a) || (DATA.meta[a].syn || []).includes(slug)) {
      pts += 1.2; chips.push({ c: "good", t: "synergy: " + nameOf(a) });
    }
  }
  for (const e of enemies) {
    if ((m.beats || []).includes(e)) { pts += 1.0; chips.push({ c: "good", t: "counters " + nameOf(e) }); }
    if ((DATA.meta[e].beats || []).includes(slug) || (m.loses || []).includes(e)) {
      pts -= 1.5; chips.push({ c: "warn", t: "countered by " + nameOf(e) });
    }
  }
  return { pts, chips };
}

function suggest() {
  const box = document.getElementById("suggList");
  const title = document.getElementById("suggTitle");
  const idx = state.activeIdx;
  if (idx === null) { title.textContent = "Draft complete"; box.innerHTML = '<p class="note">All slots filled. Click any hero on either team for their build and game plan.</p>'; return; }
  const slot = state.slots[idx];
  const isMine = slot.team === state.mine;
  const allies = teamHeroes(state.mine, "pick");
  const enemies = teamHeroes(state.mine === "blue" ? "red" : "blue", "pick");
  const tk = taken();
  const cands = Object.keys(DATA.meta).filter(h => !tk.has(h));
  if (slot.kind === "ban") {
    title.textContent = (isMine ? "Your ban" : "Their ban") + " · best targets vs " + (isMine ? "them" : "you");
    const scored = cands.map(h => {
      const m = DATA.meta[h];
      let pts = TIER_SCORE[m.tier] ?? 1;
      const chips = [];
      if (m.maps.includes(state.map)) { pts += 1.4; chips.push({ c: "map", t: "strong on this map" }); }
      for (const a of allies) if ((m.beats || []).includes(a)) { pts += 1.3; chips.push({ c: "warn", t: "hurts your " + nameOf(a) }); }
      if (m.tier === "S") chips.unshift({ c: "neutral", t: "S-tier, deny it" });
      return { h, pts, chips };
    }).sort((a, b) => b.pts - a.pts).slice(0, 5);
    render(scored, idx, "BAN");
    return;
  }
  title.textContent = isMine ? "Best picks for YOUR team" : "Likely enemy picks (their view)";
  const myAllies = isMine ? allies : enemies;
  const myEnemies = isMine ? enemies : allies;
  const scored = cands.map(h => ({ h, ...score(h, myAllies, myEnemies) }))
    .sort((a, b) => b.pts - a.pts).slice(0, 5);
  render(scored, idx, "PICK");
}

function render(scored, idx, verb) {
  const box = document.getElementById("suggList");
  box.innerHTML = "";
  scored.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "scard " + (ROLE_CLS[roleOf(s.h)] || "");
    d.innerHTML = '<div class="rank">' + (i + 1) + '</div>' + pfImg(s.h) +
      '<div class="hname">' + nameOf(s.h) + '<span class="hrole">' + roleOf(s.h) + '</span></div>' +
      '<div class="chips">' + s.chips.slice(0, 4).map(c => '<span class="chip ' + c.c + '">' + c.t + '</span>').join("") + '</div>';
    const b = document.createElement("button");
    b.className = "pickbtn"; b.textContent = verb;
    b.onclick = () => assign(idx, s.h);
    d.appendChild(b);
    box.appendChild(d);
  });
}

function assign(idx, hero) {
  state.slots[idx].hero = hero;
  if (state.slots[idx].kind === "pick" && state.slots[idx].team === state.mine) showBuild(hero);
  state.activeIdx = nextEmpty();
  closeModal(); draw();
}

function goalsFor(hero, allies, enemies) {
  const m = DATA.meta[hero], role = roleOf(hero);
  const g = [];
  if (role === "Bruiser") g.push(["early", "Hold the solo lane, soak every wave, don't die for a trade"]);
  else if (role === "Tank") g.push(["early", "Rotate with your ranged, punish anyone who steps too far up"]);
  else if (role === "Healer") g.push(["early", "Save your big cooldown for their engage, don't burn it on poke"]);
  else if (m.scale === "early") g.push(["early", "You are strongest NOW, force trades and camps before they scale"]);
  else if (m.scale === "late") g.push(["early", "Play safe and soak, you outscale everyone in this lobby"]);
  else g.push(["early", "Trade evenly, arrive at level 10 healthy and even in XP"]);
  if (m.tags.global) g.push(["mid", "Use your global to double-soak and show up to objectives late but free"]);
  else if (m.tags.camps) g.push(["mid", "Start camps right before objectives spawn so they push while you contest"]);
  else if ((m.tags.cc || 0) > 1) g.push(["mid", "Objectives are won by your setup, land it on their key hero"]);
  else g.push(["mid", "Group at 10, take the objective fight with ult advantage"]);
  if (m.scale === "late") g.push(["late", "You win late 5v5s, force them to fight around boss or objective"]);
  else g.push(["late", "Don't get caught alone, one death past 20 loses the game"]);
  const threats = enemies.filter(e => (DATA.meta[e].beats || []).includes(hero) || (m.loses || []).includes(e));
  const prey = enemies.filter(e => (m.beats || []).includes(e));
  if (threats.length) g.push(["fight", "Respect " + threats.map(nameOf).join(" and ") + ", they counter you"]);
  else if (prey.length) g.push(["fight", "Punish " + prey.map(nameOf).join(" and ") + " every time they show"]);
  return g;
}

function showBuild(hero) {
  const m = DATA.meta[hero], t = DATA.talents[hero];
  const bb = document.getElementById("buildBox");
  bb.style.display = "block";
  document.getElementById("buildPf").src = "img/" + hero + ".png";
  document.getElementById("buildTitle").textContent = t.name + " · " + roleOf(hero);
  document.getElementById("buildNote").textContent = m.note || "";
  const list = document.getElementById("buildList");
  list.innerHTML = "";
  m.build.forEach((name, i) => {
    const tier = TIERS[i];
    const tal = (t.talents[tier] || []).find(x => x.name === name);
    const row = document.createElement("div");
    row.className = "btier";
    row.innerHTML = '<span class="t">' + tier + '</span><span class="n">' + name + '</span>' +
      (tal ? '<span class="d">' + tal.description + '</span>' : "");
    list.appendChild(row);
  });
  const heroTeam = state.slots.find(s => s.hero === hero && s.kind === "pick");
  const team = heroTeam ? heroTeam.team : state.mine;
  const allies = teamHeroes(team, "pick").filter(h => h !== hero);
  const enemies = teamHeroes(team === "blue" ? "red" : "blue", "pick");
  const gl = document.getElementById("goalList");
  gl.innerHTML = "";
  goalsFor(hero, allies, enemies).forEach(([ph, txt]) => {
    const d = document.createElement("div");
    d.className = "goal";
    d.innerHTML = '<span class="ph ' + ph + '">' + (ph === "fight" ? "fights" : ph) + '</span><span>' + txt + '</span>';
    gl.appendChild(d);
  });
}

function draw() {
  for (const team of ["blue", "red"]) {
    const el = document.getElementById(team + "Slots");
    el.innerHTML = "";
    state.slots.forEach((s, i) => {
      if (s.team !== team) return;
      const d = document.createElement("div");
      d.className = "slot " + s.kind + (i === state.activeIdx ? " active" : "") + " " + (s.hero ? (ROLE_CLS[roleOf(s.hero)] || "") : "");
      d.innerHTML = '<span class="lbl">' + (s.kind === "ban" ? "BAN" : "PICK") + '</span>' +
        (s.hero ? pfImg(s.hero) : "") +
        '<span class="who ' + (s.hero ? "" : "empty") + '">' +
        (s.hero ? nameOf(s.hero) + '<span class="r">' + roleOf(s.hero) + '</span>' : "· · ·") + '</span>' +
        (s.hero ? '<span class="x" title="clear">✕</span>' : "");
      d.onclick = ev => {
        if (ev.target.classList.contains("x")) { s.hero = null; state.activeIdx = i; draw(); return; }
        if (s.hero) { if (s.kind === "pick") showBuild(s.hero); return; }
        state.activeIdx = i;
        draw(); openModal();
      };
      el.appendChild(d);
    });
  }
  const idx = state.activeIdx;
  document.getElementById("phase").textContent = idx === null ? "DRAFT COMPLETE" :
    "Now: " + state.slots[idx].team.toUpperCase() + " " + state.slots[idx].kind.toUpperCase() +
    (state.slots[idx].team === state.mine ? " (you)" : "");
  document.getElementById("mineBlue").className = "mine" + (state.mine === "blue" ? "" : " off");
  document.getElementById("mineRed").className = "mine" + (state.mine === "red" ? "" : " off");
  suggest();
}

function openModal() {
  const modal = document.getElementById("modal");
  modal.classList.add("open");
  const inp = document.getElementById("search");
  inp.value = ""; fillGrid(""); inp.focus();
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
function fillGrid(q) {
  const grid = document.getElementById("hgrid");
  grid.innerHTML = "";
  const tk = taken();
  Object.keys(DATA.talents).sort((a, b) => nameOf(a).localeCompare(nameOf(b))).forEach(h => {
    const nm = nameOf(h);
    if (q && !nm.toLowerCase().includes(q.toLowerCase())) return;
    const d = document.createElement("div");
    d.className = "hopt " + (ROLE_CLS[roleOf(h)] || "") + (tk.has(h) ? " taken" : "");
    d.innerHTML = pfImg(h) + nm + '<span class="r">' + roleOf(h) + '</span>';
    d.onclick = () => { if (state.activeIdx !== null) assign(state.activeIdx, h); };
    grid.appendChild(d);
  });
}

// wire up
const mapSel = document.getElementById("mapSel");
MAPS.forEach(m => { const o = document.createElement("option"); o.textContent = m; mapSel.appendChild(o); });
mapSel.value = state.map;
mapSel.onchange = () => { state.map = mapSel.value; draw(); };
document.getElementById("firstPick").onchange = e => { state.first = e.target.value; initSlots(); draw(); };
document.getElementById("mineBlue").onclick = () => { state.mine = "blue"; draw(); };
document.getElementById("mineRed").onclick = () => { state.mine = "red"; draw(); };
document.getElementById("resetBtn").onclick = () => { initSlots(); document.getElementById("buildBox").style.display = "none"; draw(); };
document.getElementById("search").oninput = e => fillGrid(e.target.value);
document.getElementById("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

initSlots(); draw();

// ponytail: #demo auto-plays 9 actions then stops, for screenshots of a mid-draft state
if (location.hash === "#demo") {
  for (let i = 0; i < 9 && state.activeIdx !== null; i++) {
    const top = document.querySelector("#suggList .scard .hname");
    const slug = Object.keys(DATA.talents).find(h => nameOf(h) === top.childNodes[0].textContent);
    assign(state.activeIdx, slug);
  }
}
// ponytail: headless smoke test — #selftest auto-drafts by always taking suggestion #1
if (location.hash === "#selftest") {
  try {
    const log = [];
    while (state.activeIdx !== null) {
      const idx = state.activeIdx, slot = state.slots[idx];
      const top = document.querySelector("#suggList .scard .hname");
      if (!top) throw new Error("no suggestion at slot " + idx);
      const name = top.childNodes[0].textContent;
      const slug = Object.keys(DATA.talents).find(h => nameOf(h) === name);
      log.push(slot.team + " " + slot.kind + ": " + name + " (" + roleOf(slug) + ")");
      assign(idx, slug);
    }
    if (state.slots.some(s => !s.hero)) throw new Error("unfilled slot");
    const all = state.slots.map(s => s.hero);
    if (new Set(all).size !== 16) throw new Error("duplicate hero");
    for (const team of ["blue", "red"]) {
      const roles = teamHeroes(team, "pick").map(roleOf);
      if (!roles.includes("Tank")) throw new Error(team + " has no tank");
      if (!roles.includes("Healer")) throw new Error(team + " has no healer");
      if (roles.filter(r => r === "Ranged Assassin").length > 2) throw new Error(team + " has 3+ ranged");
    }
    document.title = "SELFTEST OK";
    document.body.innerHTML = '<pre style="font-size:15px;color:#22c55e">SELFTEST OK\n' + log.join("\n") + '</pre>';
  } catch (e) { document.body.innerHTML = '<pre style="font-size:18px;color:#ef4444">SELFTEST FAIL: ' + e.message + '</pre>'; }
}
</script>
